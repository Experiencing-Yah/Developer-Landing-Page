<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Hebrew Harvester — a farming game set in ancient Israel. Work the land, keep the Sabbath, and go up to Jerusalem for the feasts."
    />
    <title>Hebrew Harvester | Experiencing Yah</title>
    <link rel="icon" type="image/svg+xml" href="/FlameMaterial.svg" />
    <link rel="alternate icon" href="/FlameMaterial.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/analytics.js"></script>
    <style>
      body.game-page.hh-full {
        height: 100dvh;
        overflow: hidden;
      }
      body.game-page.hh-full .game-main {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
      }
      body.game-page.hh-full #game-container {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      #hh-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #2a1f18;
      }
      body.game-page.hh-full .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 0.3rem 1rem;
        border-top-width: 1px;
      }
      body.game-page.hh-full .footer-tt {
        margin: 0;
        flex-direction: row;
        gap: 0.5rem;
      }
      body.game-page.hh-full .footer-tt-logo {
        height: 20px;
      }
      body.game-page.hh-full .footer-tt-note {
        display: none;
      }
      body.game-page.hh-full .footer p {
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body class="game-page hh-full">
    <nav class="navbar navbar--compact" id="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <a href="/" aria-label="Experiencing Yah home">
            <img src="/Logo.png" alt="Experiencing Yah" />
          </a>
        </div>
        <a class="btn btn-secondary" href="/games/">All Games</a>
      </div>
    </nav>
    <main class="game-main">
      <div id="game-container">
        <iframe
          id="hh-frame"
          src="play/"
          title="Hebrew Harvester"
          allow="autoplay; fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-tt">
        <a
          href="https://thinktransformationinc.com"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-tt-link"
          aria-label="Think Transformation Inc"
        >
          <img
            src="/TT-Logo.svg"
            alt="Think Transformation Inc"
            class="footer-tt-logo"
          />
        </a>
        <p class="footer-tt-note">A division of Think Transformation Inc</p>
      </div>
      <p>&copy; 2026 Experiencing Yah. All rights reserved.</p>
    </footer>
    <script>
      const frame = document.getElementById('hh-frame');
      frame.addEventListener('load', () => frame.focus());
    </script>
  </body>
</html>
