<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="David's Defenders — the many adventures of David's Mighty Men. A Scripture-inspired browser game from Experiencing Yah."
    />
    <title>David's Defenders | Experiencing Yah</title>
    <link rel="stylesheet" href="../site.css" />
    <style>
      :root {
        --gold: #f0d878;
        --parchment: #f5e6c8;
        --night: #1a1525;
        --stone: #8a7860;
        --blood: #8a2820;
        --blue: #3a5a8a;
      }
      #game-container {
        position: relative;
        width: 660px;
        max-width: 100%;
        font-family: Georgia, 'Palatino Linotype', serif;
        color: var(--parchment);
      }
      #hud {
        background: linear-gradient(180deg, #2d2640, #221d33);
        border: 2px solid var(--gold);
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 14px;
      }
      .music-toggle {
        -webkit-appearance: none;
        appearance: none;
        flex-shrink: 0;
        position: relative;
        width: 2.25rem;
        height: 2.25rem;
        min-width: 2.25rem;
        min-height: 2.25rem;
        padding: 0;
        margin: 0;
        border: 2px solid var(--gold);
        border-radius: 8px;
        background: linear-gradient(180deg, #2d2640, #221d33);
        background-color: #221d33;
        color: var(--gold);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        line-height: 0;
        overflow: hidden;
      }
      .music-toggle__icon {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        margin: auto;
        width: 1.1rem;
        height: 1.1rem;
        display: block;
        opacity: 0;
        pointer-events: none;
        fill: currentColor;
      }
      .music-toggle:not(.is-muted) .music-toggle__icon--on,
      .music-toggle.is-muted .music-toggle__icon--off {
        opacity: 1;
      }
      .touch-controls--temple {
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        gap: 0.75rem;
      }
      .touch-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.45rem;
      }
      @media (max-width: 820px), (pointer: coarse) {
        .touch-controls--temple {
          display: flex;
        }
      }
      .hud-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .hud-label {
        color: var(--gold);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .hud-value {
        font-size: 18px;
        font-weight: bold;
        color: var(--parchment);
        min-height: 1.2em;
      }
      #canvas-wrap {
        position: relative;
        border: 2px solid var(--gold);
        border-top: none;
        border-radius: 0 0 10px 10px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      .bar-bg {
        width: 100px;
        height: 8px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--gold);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--gold);
        transition: width 0.3s;
        border-radius: 3px;
      }
      .bar-bg.is-hidden {
        display: none;
      }
    </style>
      <link rel="stylesheet" href="../embed.css" />
  </head>
  <body class="game-page">
    <main class="game-main">
      <div id="game-container">
      <div id="hud">
        <div class="hud-section">
          <div class="hud-label" id="hud-label-mode">Mode</div>
          <div class="hud-value" id="hud-mode">—</div>
        </div>
        <div class="hud-section">
          <div class="hud-label" id="hud-label-stat">Stat</div>
          <div class="hud-value" id="hud-stat">—</div>
        </div>
        <div class="hud-section">
          <div class="hud-label" id="hud-label-health">Health</div>
          <div class="bar-bg is-hidden">
            <div class="bar-fill" id="hud-bar" style="width: 100%"></div>
          </div>
          <div class="hud-value" id="hud-val3">—</div>
        </div>
        <div class="hud-section">
          <div class="hud-label" id="hud-label-info">Info</div>
          <div class="hud-value" id="hud-info">—</div>
        </div>
          <button
            type="button"
            id="music-toggle"
            class="music-toggle"
            aria-label="Mute music"
            aria-pressed="false"
          >
            <svg
              class="music-toggle__icon music-toggle__icon--on"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
              />
            </svg>
            <svg
              class="music-toggle__icon music-toggle__icon--off"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v4h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
              />
            </svg>
          </button>
      </div>
      <div id="canvas-wrap">
        <canvas id="game" width="640" height="640"></canvas>
      </div>
        <div
          class="touch-controls touch-controls--temple"
          aria-label="Touch controls"
        >
          <div class="touch-dpad">
            <button
              type="button"
              class="touch-btn"
              data-key="arrowup"
              aria-label="Up"
            >
              ▲
            </button>
            <button
              type="button"
              class="touch-btn"
              data-key="arrowleft"
              aria-label="Left"
            >
              ◀
            </button>
            <button
              type="button"
              class="touch-btn"
              data-key="arrowdown"
              aria-label="Down"
            >
              ▼
            </button>
            <button
              type="button"
              class="touch-btn"
              data-key="arrowright"
              aria-label="Right"
            >
              ▶
            </button>
          </div>
          <div class="touch-actions">
            <button
              type="button"
              class="touch-btn touch-btn--action"
              id="touch-attack"
              aria-label="Attack"
            >
              Atk
            </button>
            <button
              type="button"
              class="touch-btn touch-btn--action"
              id="touch-spear"
              aria-label="Spear"
            >
              Spear
            </button>
            <button
              type="button"
              class="touch-btn touch-btn--action"
              id="touch-arrow"
              aria-label="Bow"
            >
              Bow
            </button>
            <button
              type="button"
              class="touch-btn touch-btn--action"
              id="touch-action"
              aria-label="Start or continue"
            >
              Go
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="../scores.js"></script>
    <script src="../audio.js"></script>
    <script>
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var W = canvas.width,
        H = canvas.height;
      function el(id) {
        return document.getElementById(id);
      }
      var hudMode = el('hud-mode'),
        hudStat = el('hud-stat'),
        hudBar = el('hud-bar'),
        hudBarBg = hudBar ? hudBar.parentElement : null,
        hudInfo = el('hud-info');
      var hudLabelMode = el('hud-label-mode'),
        hudLabelStat = el('hud-label-stat'),
        hudLabelHealth = el('hud-label-health'),
        hudLabelInfo = el('hud-label-info'),
        hudVal3 = el('hud-val3');

      function setHudBarVisible(visible) {
        if (!hudBarBg) return;
        hudBarBg.classList.toggle('is-hidden', !visible);
      }

      function setPlaceholderHud() {
        hudLabelMode.textContent = 'Mode';
        hudLabelStat.textContent = 'Stat';
        hudLabelHealth.textContent = 'Health';
        hudLabelInfo.textContent = 'Info';
        hudMode.textContent = '\u2014';
        hudStat.textContent = '\u2014';
        hudVal3.textContent = '\u2014';
        hudInfo.textContent = '\u2014';
        setHudBarVisible(false);
      }

      // === STATE ===
      var state = 'menu';
      var playSource = 'menu';
      var waterQuestUnlocked = false;
      var selectedChar = null;
      var completed = { josheb: false, eleazar: false, shammah: false };
      var davidUnlocked = false;
      var davidVictory = false;
      var goliathSwordUnlocked = false;
      var swordEnabled = true; // Goliath's Sword toggle (default on when unlocked)
      var swordCheckbox = null; // canvas hitbox of the char-select checkbox
      function swordActive() {
        return goliathSwordUnlocked && swordEnabled;
      }
      // Water quest state
      var wq = {
        px: 50,
        py: 320,
        dir: { x: 1, y: 0 },
        enemies: [],
        kills: 0,
        healths: [100, 100, 100],
        spawnT: 0,
        hasWater: false,
        waterX: 590,
        waterY: 320,
        caveX: 30,
        caveY: 320,
        phase: 'fight',
        msg: '',
        msgT: 0,
        swordCD: 0,
        spearCD: 0,
        arrowCD: 0,
        swordT: 0,
        spearT: 0,
        charNames: ['Josheb', 'Eleazar', 'Shammah'],
        arrows: [],
      };
      var keys = {};
      var lastTime = 0,
        animTime = 0;
      var shake = 0;
      var particles = [],
        popups = [];

      // Josheb state
      var jb = {
        px: 320,
        py: 320,
        dir: { x: 1, y: 0 },
        atkT: 0,
        atkCD: 0,
        enemies: [],
        kills: 0,
        total: 800,
        health: 100,
        spawnT: 0,
        spawnRate: 0.08,
        wave: 0,
      };

      // Eleazar state
      var el_state = {
        px: 320,
        py: 320,
        dir: { x: 1, y: 0 },
        swingT: 0,
        health: 100,
        wave: 0,
        waveEnemies: [],
        waveTarget: 0,
        waveKills: 0,
        resting: false,
        restT: 0,
        enemiesKilled: 0,
        maxWaves: 8,
      };

      // Shammah state
      var sh = {
        px: 320,
        py: 320,
        dir: { x: 1, y: 0 },
        atkT: 0,
        atkCD: 0,
        enemies: [],
        plotX: 300,
        plotY: 300,
        plotW: 40,
        plotH: 40,
        breaches: 0,
        maxBreaches: 5,
        wave: 0,
        spawnT: 0,
        surviveTime: 60,
        surviveT: 0,
        kills: 0,
      };

      // David state
      var dv = {
        angle: 30,
        power: 0,
        charging: false,
        stones: 5,
        thrown: [],
        goliathX: 520,
        goliathY: 320,
        goliathHeadR: 22,
        phase: 'aim',
        msg: '',
        hitT: 0,
      };

      function trackPlayStart() {
        if (
          typeof window.trackGamePlay === 'function' &&
          (playSource === 'menu' || playSource === 'gameover')
        ) {
          window.trackGamePlay(
            "David's Defenders",
            playSource === 'gameover' ? 'restart' : 'start',
          );
        }
        playSource = 'playing';
      }

      function goGameOver() {
        playSource = 'gameover';
        state = 'gameover';
      }

      window.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        if (
          [
            'arrowup',
            'arrowdown',
            'arrowleft',
            'arrowright',
            ' ',
            'j',
            'k',
            'l',
            'w',
            'a',
            's',
            'd',
            'p',
          ].indexOf(k) >= 0
        )
          e.preventDefault();
        if (!keys[k]) {
          keys[k] = true;
          handleKeyPress(k);
        }
      });
      canvas.addEventListener('click', function () {
        if (
          state === 'menu' ||
          state === 'charselect' ||
          state === 'levelcomplete' ||
          state === 'gameover' ||
          state === 'davidvictory' ||
          state === 'water_cutscene' ||
          state === 'paused'
        ) {
          handleKeyPress(' ');
        }
      });
      window.addEventListener('keyup', function (e) {
        var k = e.key.toLowerCase();
        keys[k] = false;
        if (
          (k === 'j' || k === 'k') &&
          state === 'david_fight' &&
          dv.charging
        ) {
          throwStone();
          dv.charging = false;
        }
      });

      var pausedFrom = '';
      function handleKeyPress(k) {
        if (k === 'p') {
          if (
            state === 'playing' ||
            state === 'david_fight' ||
            state === 'water_quest'
          ) {
            pausedFrom = state;
            state = 'paused';
          } else if (state === 'paused') {
            state = pausedFrom;
          }
          return;
        }
        if (k === ' ') {
          if (state === 'menu') state = 'charselect';
          else if (state === 'paused') {
            state = pausedFrom;
            return;
          } else if (state === 'charselect') selectCurrent();
          else if (state === 'levelcomplete') {
            state = 'charselect';
          } else if (state === 'water_cutscene') unlockDavidAndReturn();
          else if (state === 'davidvictory') {
            playSource = 'menu';
            state = 'menu';
          }
          else if (state === 'gameover') state = 'charselect';
        }
        if (state === 'paused') {
          if (k === 'escape' || k === 'backspace') {
            state = 'charselect';
          }
        }
        if (k === 'j') {
          if (state === 'playing' && selectedChar === 'shammah') {
            if (swordActive()) shammahSwordSwing();
            else shootShammahArrow();
          }
          if (state === 'playing' && selectedChar === 'eleazar') {
            var ea =
              (Math.atan2(el_state.dir.y, el_state.dir.x) * 180) / Math.PI;
            eleazarSwingDir((ea + 360) % 360);
          }
          if (state === 'water_quest') wqAttack('sword');
          if (state === 'david_fight' && dv.phase === 'aim' && dv.stones > 0)
            dv.charging = true;
          // Sword fight mode: J is read via keys['j'] in updateDavid
        }
          if (k === 'k') {
            if (state === 'playing' && selectedChar === 'eleazar') {
              var ka =
                (Math.atan2(el_state.dir.y, el_state.dir.x) * 180) / Math.PI;
              eleazarSwingDir((ka + 360) % 360);
            }
            if (state === 'playing' && selectedChar === 'shammah') {
              if (swordActive()) shammahSwordSwing();
              else shootShammahArrow();
            }
            if (state === 'water_quest') wqAttack('spear');
            if (state === 'david_fight' && dv.phase === 'aim' && dv.stones > 0)
              dv.charging = true;
          }
        // Eleazar: W/A/S/D directional swipes
        if (state === 'playing' && selectedChar === 'eleazar') {
          if (k === 'w' || k === 'arrowup') eleazarSwingDir(270); // up
          if (k === 's' || k === 'arrowdown') eleazarSwingDir(90); // down
          if (k === 'a' || k === 'arrowleft') eleazarSwingDir(180); // left
          if (k === 'd' || k === 'arrowright') eleazarSwingDir(0); // right
        }
        if (k === 'l') {
          if (state === 'water_quest') wqShootArrow();
        }
        if (state === 'charselect') {
          if (k === 'arrowleft' || k === 'a') {
            if (charSelIdx <= 2) {
              charSelTopIdx = charSelIdx;
              charSelIdx = (charSelIdx + 2) % 3;
            } else if (charSelIdx === 3 && waterQuestUnlocked) charSelIdx = 4;
            else if (charSelIdx === 4)
              charSelIdx = goliathSwordUnlocked
                ? 5
                : waterQuestUnlocked
                  ? 3
                  : charSelTopIdx;
            else if (charSelIdx === 5) charSelIdx = 4;
          }
          if (k === 'arrowright' || k === 'd') {
            if (charSelIdx <= 2) {
              charSelTopIdx = charSelIdx;
              charSelIdx = (charSelIdx + 1) % 3;
            } else if (charSelIdx === 3 && waterQuestUnlocked) charSelIdx = 4;
            else if (charSelIdx === 4)
              charSelIdx = goliathSwordUnlocked
                ? 5
                : waterQuestUnlocked
                  ? 3
                  : charSelTopIdx;
            else if (charSelIdx === 5) charSelIdx = 4;
          }
          if (k === 'arrowdown' || k === 's') {
            if (charSelIdx <= 2) {
              charSelTopIdx = charSelIdx;
              charSelIdx = waterQuestUnlocked ? 3 : 4;
            } else if (charSelIdx === 3) charSelIdx = 4;
            else if (charSelIdx === 4 && goliathSwordUnlocked) charSelIdx = 5;
          }
          if (k === 'arrowup' || k === 'w') {
            if (charSelIdx === 3) charSelIdx = charSelTopIdx;
            else if (charSelIdx === 4)
              charSelIdx = waterQuestUnlocked ? 3 : charSelTopIdx;
            else if (charSelIdx === 5) charSelIdx = 4;
          }
        }
      }

      // === CHARACTER SELECT ===
      // 5 selectable items: 0-2 = the three warriors, 3 = Water Quest bar,
      // 4 = David. charSelIdx 0-3 map directly to charData indices.
      var charSelIdx = 0;
      var charSelTopIdx = 0;
      var charData = [
        {
          id: 'josheb',
          name: 'Josheb-Basshebeth',
          desc: 'Spear against 800 men',
          color: '#8a6840',
          sub: '"He raised his spear against 800 men"',
        },
        {
          id: 'eleazar',
          name: 'Eleazar',
          desc: 'Endure the waves',
          color: '#4a6a8a',
          sub: '"His hand clung to the sword"',
        },
        {
          id: 'shammah',
          name: 'Shammah',
          desc: 'Defend the plot',
          color: '#5a7a4a',
          sub: '"He defended the field of lentils"',
        },
        {
          id: 'david',
          name: '???',
          desc: 'Locked',
          color: '#444',
          sub: 'Complete the Water Quest to unlock',
          locked: true,
        },
      ];

      function selectCurrent() {
        // Goliath's Sword toggle (index 5)
        if (charSelIdx === 5) {
          if (!goliathSwordUnlocked) return;
          swordEnabled = !swordEnabled;
          saveProgress();
          return;
        }
        // Water Quest bar (index 3)
        if (charSelIdx === 3) {
          if (!waterQuestUnlocked) return;
          trackPlayStart();
          selectedChar = 'water';
          initWaterQuest();
          state = 'water_quest';
          return;
        }
        // David (index 4)
        if (charSelIdx === 4) {
          if (!davidUnlocked) return;
          trackPlayStart();
          selectedChar = 'david';
          initDavid();
          state = 'david_fight';
          updateHUD();
          return;
        }
        var c = charData[charSelIdx];
        if (c.locked && !davidUnlocked) return;
        selectedChar = c.id;
        startMode();
      }

      function startMode() {
        trackPlayStart();
        if (selectedChar === 'josheb') initJosheb();
        else if (selectedChar === 'eleazar') initEleazar();
        else if (selectedChar === 'shammah') initShammah();
        else if (selectedChar === 'david') initDavid();
        state = 'playing';
        if (selectedChar === 'david') state = 'david_fight';
        updateHUD();
      }

      (function setupTouchControls() {
        var root = document.querySelector('.touch-controls');
        if (!root) return;
        function holdKey(key, down) {
          keys[key] = !!down;
        }
        function bindHold(btn, key, onStart, onEnd) {
          if (!btn) return;
          function start(e) {
            e.preventDefault();
            btn.classList.add('is-active');
            holdKey(key, true);
            if (onStart) onStart();
            else handleKeyPress(key);
          }
          function end(e) {
            e.preventDefault();
            btn.classList.remove('is-active');
            holdKey(key, false);
            if (onEnd) onEnd();
          }
          btn.addEventListener('touchstart', start, { passive: false });
          btn.addEventListener('touchend', end, { passive: false });
          btn.addEventListener('touchcancel', end, { passive: false });
          btn.addEventListener('mousedown', start);
          btn.addEventListener('mouseup', end);
          btn.addEventListener('mouseleave', end);
        }
        root.querySelectorAll('.touch-btn[data-key]').forEach(function (btn) {
          bindHold(btn, btn.getAttribute('data-key'));
        });
        function bindTap(btn, fn) {
          if (!btn) return;
          function fire(e) {
            e.preventDefault();
            btn.classList.add('is-active');
            fn();
            setTimeout(function () {
              btn.classList.remove('is-active');
            }, 120);
          }
          btn.addEventListener('touchstart', fire, { passive: false });
          btn.addEventListener('click', fire);
        }
        bindHold(
          document.getElementById('touch-attack'),
          'j',
          function () {
            handleKeyPress('j');
          },
          function () {
            if (state === 'david_fight' && dv.charging) {
              throwStone();
              dv.charging = false;
            }
          },
        );
        bindTap(document.getElementById('touch-spear'), function () {
          handleKeyPress('k');
        });
        bindTap(document.getElementById('touch-arrow'), function () {
          handleKeyPress('l');
        });
        bindTap(document.getElementById('touch-action'), function () {
          if (
            state === 'playing' ||
            state === 'david_fight' ||
            state === 'water_quest'
          ) {
            handleKeyPress('p');
          } else {
            handleKeyPress(' ');
          }
        });
      })();

      // === JOSHEB-BASSHEBETH ===
      function initJosheb() {
        jb = {
          px: 320,
          py: 320,
          dir: { x: 1, y: 0 },
          atkT: 0,
          atkCD: 0,
          atkStabAngle: 0,
          enemies: [],
          kills: 0,
          total: 800,
          health: 100,
          wave: 0,
          spawnToggle: 0,
        };
        // Start with 5 enemies
        for (var i = 0; i < 5; i++) spawnJoshebEnemy();
      }

      function updateJosheb(dt) {
        // Movement
        var dx = 0,
          dy = 0;
        if (keys['arrowleft'] || keys['a']) dx = -1;
        if (keys['arrowright'] || keys['d']) dx = 1;
        if (keys['arrowup'] || keys['w']) dy = -1;
        if (keys['arrowdown'] || keys['s']) dy = 1;
        if (dx && dy) {
          dx *= 0.707;
          dy *= 0.707;
        }
        var spd = 120;
        if (dx || dy) {
          jb.px += dx * spd * dt;
          jb.py += dy * spd * dt;
          jb.px = Math.max(20, Math.min(W - 20, jb.px));
          jb.py = Math.max(20, Math.min(H - 20, jb.py));
          if (Math.abs(dx) > Math.abs(dy)) {
            jb.dir = { x: dx > 0 ? 1 : -1, y: 0 };
          } else {
            jb.dir = { x: 0, y: dy > 0 ? 1 : -1 };
          }
        }
        // Spear attack
        if (jb.atkT > 0) jb.atkT -= dt;
        if (jb.atkCD > 0) jb.atkCD -= dt;
        if ((keys['j'] || keys['k'] || keys[' ']) && jb.atkCD <= 0) {
          jb.atkT = 0.3;
          jb.atkCD = 0.4;
          // Random stab angle: 0=straight, about -0.25 to +0.25 radians (+-14 degrees)
          jb.atkStabAngle = (Math.random() - 0.5) * 0.5;
        }
        // Enemies only spawn on kill (no passive trickle)
        // Update enemies
        for (var i = 0; i < jb.enemies.length; i++) {
          var e = jb.enemies[i];
          var ex = e.x - jb.px,
            ey = e.y - jb.py;
          var d = Math.sqrt(ex * ex + ey * ey);
          if (d > 1) {
            e.x -= (ex / d) * 40 * dt;
            e.y -= (ey / d) * 40 * dt;
          }
          e.atkCD -= dt;
          if (d < 30 && e.atkCD <= 0) {
            e.atkCD = 1.0;
            jb.health -= 2;
            shake = 3;
            spawnParticles(jb.px, jb.py, '#c43030', 5);
          }
        }
        // Attack hit detection: Goliath's Sword = wide 90-degree swing arc with
        // one-hit kills and long reach; otherwise the angled spear stab.
        if (jb.atkT > 0) {
          for (var i = jb.enemies.length - 1; i >= 0; i--) {
            var e = jb.enemies[i];
            var hit = false;
            if (swordActive()) {
              var dxs = e.x - jb.px,
                dys = e.y - jb.py;
              var ds = Math.sqrt(dxs * dxs + dys * dys);
              if (ds <= 110 && ds > 0.1) {
                var dotS = (dxs * jb.dir.x + dys * jb.dir.y) / ds;
                if (Math.acos(Math.max(-1, Math.min(1, dotS))) <= Math.PI / 2)
                  hit = true;
              }
            } else {
              var sa = jb.atkStabAngle || 0;
              // Perpendicular direction for side-swing
              var perpX = -jb.dir.y,
                perpY = jb.dir.x;
              // Check along the stab line (which varies by angle)
              var spearLen = 75;
              for (var s2 = 0; s2 < spearLen; s2 += 8) {
                var sx = jb.px + jb.dir.x * s2 + perpX * s2 * sa;
                var sy = jb.py + jb.dir.y * s2 + perpY * s2 * sa;
                // Tapered blast: 20px near the character, 30px at the spear tip
                var hitRadius = 20 + (s2 / spearLen) * 10;
                if (
                  Math.abs(e.x - sx) < hitRadius &&
                  Math.abs(e.y - sy) < hitRadius
                ) {
                  hit = true;
                  break;
                }
              }
            }
            if (hit) {
              spawnParticles(e.x, e.y, '#c43030', 8);
              jb.enemies.splice(i, 1);
              jb.kills++;
              shake = 2;
              // Alternate: 1 then 2 then 1 then 2...
              var spawnCount = 1 + jb.spawnToggle;
              jb.spawnToggle = 1 - jb.spawnToggle;
              for (
                var ns = 0;
                ns < spawnCount && jb.kills + jb.enemies.length < jb.total;
                ns++
              ) {
                spawnJoshebEnemy();
              }
            }
          }
        }
        // Wave progression
        if (jb.kills >= (jb.wave + 1) * 100 && jb.kills < 800) {
          jb.wave++;
        }
        // Win check
        if (jb.kills >= jb.total) {
          completed.josheb = true;
          saveProgress();
          checkDavidUnlock();
          state = 'levelcomplete';
          keys = {};
        }
        if (jb.health <= 0) {
          goGameOver();
          keys = {};
        }
      }

      function spawnJoshebEnemy() {
        var side = Math.floor(Math.random() * 4);
        var x, y;
        if (side === 0) {
          x = Math.random() * W;
          y = -15;
        } else if (side === 1) {
          x = W + 15;
          y = Math.random() * H;
        } else if (side === 2) {
          x = Math.random() * W;
          y = H + 15;
        } else {
          x = -15;
          y = Math.random() * H;
        }
        jb.enemies.push({ x: x, y: y, atkCD: 1.0, hue: Math.random() * 30 });
      }

      function renderJosheb() {
        // Battlefield - rolling field with depth
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#6a8a4a');
        bg.addColorStop(0.3, '#5a7a3a');
        bg.addColorStop(0.7, '#4a6a2a');

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < 120; i++) {

          ctx.fillRect(gx, gy, 1, 4);
          ctx.fillRect(gx + 2, gy + 1, 1, 3);
          ctx.fillStyle = 'rgba(80,110,40,0.3)';
          ctx.fillRect(gx + 1, gy - 1, 1, 2);
        }
        // Scattered rocks
        for (var i = 0; i < 15; i++) {

          ctx.arc(rx, ry, 3, 0, Math.PI * 2);

          ctx.fillStyle = '#9a9080';
          ctx.beginPath();
          ctx.arc(rx - 1, ry - 1, 2, 0, Math.PI * 2);
