        }
        // Distant hills
        ctx.fillStyle = 'rgba(60,80,40,0.4)';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.15);
        for (var x = 0; x <= W; x += 30)
          ctx.lineTo(x, H * 0.15 - Math.sin(x * 0.02) * 20);
        ctx.lineTo(W, 0);
        ctx.lineTo(0, 0);
        ctx.fill();
        // Enemies
        for (var i = 0; i < jb.enemies.length; i++) {
          var e = jb.enemies[i];
          ctx.fillStyle = '#7a5a3a';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#5a3a2a';
          ctx.beginPath();
          ctx.arc(e.x, e.y - 4, 4, 0, Math.PI * 2);
          ctx.fill();
          // Spear
          ctx.strokeStyle = '#3a2a1a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(e.x + 4, e.y);
          ctx.lineTo(e.x + 12, e.y + 2);
          ctx.stroke();
        }
        // Player (Josheb)
        drawWarrior(jb.px, jb.py, jb.dir, '#d4a574', '#3a2818');
        if (swordActive()) {
          // Goliath's Sword: wide 90-degree swing arc animation
          var baseA = Math.atan2(jb.dir.y, jb.dir.x);
          if (jb.atkT > 0) {
            var progJ = 1 - jb.atkT / 0.3;
            var sweepJ = Math.PI / 2;
            var startJ = baseA - sweepJ / 2;
            ctx.strokeStyle =
              'rgba(240,216,120,' + (0.7 * (1 - progJ)).toFixed(3) + ')';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(jb.px, jb.py, 55, startJ, startJ + sweepJ * progJ);
            ctx.stroke();
            ctx.strokeStyle =
              'rgba(255,255,255,' + (0.9 * (1 - progJ)).toFixed(3) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(jb.px, jb.py, 62, startJ, startJ + sweepJ * progJ);
            ctx.stroke();
            var blJ = startJ + sweepJ * progJ;
            ctx.strokeStyle = '#c0c0d0';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(jb.px + Math.cos(blJ) * 12, jb.py + Math.sin(blJ) * 12);
            ctx.lineTo(jb.px + Math.cos(blJ) * 65, jb.py + Math.sin(blJ) * 65);
            ctx.stroke();
          } else {
            // Held sword at rest
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(
              jb.px + Math.cos(baseA) * 6,
              jb.py + Math.sin(baseA) * 6,
            );
            ctx.lineTo(
              jb.px + Math.cos(baseA) * 14,
              jb.py + Math.sin(baseA) * 14,
            );
            ctx.stroke();
            ctx.strokeStyle = '#c0c0d0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(
              jb.px + Math.cos(baseA) * 14,
              jb.py + Math.sin(baseA) * 14,
            );
            ctx.lineTo(
              jb.px + Math.cos(baseA) * 50,
              jb.py + Math.sin(baseA) * 50,
            );
            ctx.stroke();
          }
        } else {
          // Spear - with random stab angle
          var sa = jb.atkStabAngle || 0;
          var perpX = -jb.dir.y,
            perpY = jb.dir.x;
          var sx = jb.px + jb.dir.x * 15,
            sy = jb.py + jb.dir.y * 15;
          ctx.strokeStyle = '#6a4a2a';
          ctx.lineWidth = 3;
          var sLen = jb.atkT > 0 ? 60 : 35;
          var tipX = jb.px + jb.dir.x * sLen + perpX * sLen * sa;
          var tipY = jb.py + jb.dir.y * sLen + perpY * sLen * sa;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();
          ctx.strokeStyle = '#c0c0c0';
          ctx.lineWidth = 2;
          var tip2X = tipX + (jb.dir.x + perpX * sa) * 8;
          var tip2Y = tipY + (jb.dir.y + perpY * sa) * 8;
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.lineTo(tip2X, tip2Y);
          ctx.stroke();
        }
      }

      // === ELEAZAR ===
      function initEleazar() {
        el_state = {
          px: 320,
          py: 320,
          dir: { x: 1, y: 0 },
          swingT: 0,
          health: 100,
          wave: 0,
          waveEnemies: [],
          waveTarget: 0,
          waveKills: 0,
          resting: false,
          restT: 0,
          enemiesKilled: 0,
          maxWaves: 8,
        };
        el_state.waveTarget = 15;
      }

      // W=up, A=left, S=down, D=right. Each swipe is in that fixed direction.
      // Enemies come from all 4 sides and you must swipe the direction they approach from.
      function eleazarSwingDir(angleDeg) {
        if (el_state.resting) return;
        if (el_state.swingT > 0.2) return;
        var ang = (angleDeg * Math.PI) / 180;
        var dirX = Math.cos(ang),
          dirY = Math.sin(ang);
        el_state.arcAngle = angleDeg;
        el_state.swingT = 0.22;
        el_state.dir = { x: dirX, y: dirY };
        // Hit enemies within ~70px in a 60 degree arc toward that direction
        for (var i = el_state.waveEnemies.length - 1; i >= 0; i--) {
          var e = el_state.waveEnemies[i];
          if (e.dead) continue;
          var dx = e.x - el_state.px,
            dy = e.y - el_state.py;
          var d = Math.sqrt(dx * dx + dy * dy);
          var reach = swordActive() ? 280 : 75;
          if (d > reach || d < 1) continue;
          var dot = (dx * dirX + dy * dirY) / d;
          var angDiff = Math.acos(Math.max(-1, Math.min(1, dot)));
          if (angDiff <= (swordActive() ? Math.PI / 2 : Math.PI / 3)) {
            // 60 degree arc (90 with Goliath's sword)
            var kbx = (dx / d) * 25,
              kby = (dy / d) * 25;
            e.x += kbx;
            e.y += kby;
            e.hitT = 0.2;
            spawnParticles(e.x, e.y, '#c43030', 8);
            e.dead = true;
            el_state.waveKills++;
            el_state.enemiesKilled++;
            popups.push({
              x: e.x,
              y: e.y,
              text: 'SLAIN!',
              life: 0.8,
              color: '#f0d878',
            });
            spawnParticles(e.x, e.y, '#f0d878', 6);
          }
        }
      }

      function updateEleazar(dt) {
        if (el_state.swingT > 0) el_state.swingT -= dt;
        // Resting between waves
        if (el_state.resting) {
          el_state.restT -= dt;
          if (el_state.restT <= 0) {
            el_state.resting = false;
            el_state.wave++;
            if (el_state.wave > el_state.maxWaves) {
              completed.eleazar = true;
              saveProgress();
              checkDavidUnlock();
              state = 'levelcomplete';
              keys = {};
              return;
            }
            startEleazarWave();
          }
          return;
        }
        // Spawn wave enemies - faster spawn rate
        var alive = 0;
        for (var i = 0; i < el_state.waveEnemies.length; i++)
          if (!el_state.waveEnemies[i].dead) alive++;
        if (alive === 0 && el_state.waveKills >= el_state.waveTarget) {
          el_state.resting = true;
          el_state.restT = 2;
          return;
        }
        var totalSpawned = el_state.waveEnemies.length;
        if (totalSpawned < el_state.waveTarget) {
          if (Math.random() < dt * 4) {
            // faster spawn
            spawnEleazarEnemy();
          }
        }
        // Update enemies - faster approach, more aggressive attacks
        var enemySpeed = 35 + el_state.wave * 3; // speeds up each wave
        for (var i = 0; i < el_state.waveEnemies.length; i++) {
          var e = el_state.waveEnemies[i];
          if (e.dead) continue;
          if (e.hitT > 0) e.hitT -= dt;
          var dx = e.x - el_state.px,
            dy = e.y - el_state.py;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > 32) {
            e.x -= (dx / d) * enemySpeed * dt;
            e.y -= (dy / d) * enemySpeed * dt;
          } else {
            // In melee range - faster attacks
            e.atkCD -= dt;
            e.swingT = e.atkCD > 0.2 ? 0.25 : 0;
            if (e.atkCD <= 0) {
              e.atkCD = 0.7; // faster attacks (was 1.0)
              el_state.health -= 10; // more damage (was 8)
              shake = 3;
              spawnParticles(el_state.px, el_state.py, '#c43030', 5);
            }
          }
        }
        if (el_state.health <= 0) {
          goGameOver();
          keys = {};
        }
      }

      function spawnEleazarEnemy() {
        var side = Math.floor(Math.random() * 4);
        var x, y;
        if (side === 0) {
          x = Math.random() * W;
          y = -15;
        } else if (side === 1) {
          x = W + 15;
          y = Math.random() * H;
        } else if (side === 2) {
          x = Math.random() * W;
          y = H + 15;
        } else {
          x = -15;
          y = Math.random() * H;
        }
        el_state.waveEnemies.push({
          x: x,
          y: y,
          hp: 3,
          dead: false,
          atkCD: 0.3,
        });
      }

      function startEleazarWave() {
        el_state.waveEnemies = [];
        el_state.waveKills = 0;
        // Wave sizes: 15,20,25,30,35,40,45,50,55 (total ~315)
        el_state.waveTarget = Math.min(55, 15 + el_state.wave * 5);
      }

      function renderEleazar() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#5a6a4a');
        bg.addColorStop(0.5, '#4a5a3a');
        bg.addColorStop(1, '#3a4a2a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        // Field texture
        for (var i = 0; i < 100; i++) {
          var gx = (i * 41) % W,
            gy = (i * 59) % H;
          ctx.fillStyle = 'rgba(50,70,20,0.3)';
          ctx.fillRect(gx, gy, 1, 3);
        }
        // Dirt patches
        for (var i = 0; i < 20; i++) {
          var dx2 = (i * 73) % W,
            dy2 = (i * 47) % H;
          ctx.fillStyle = 'rgba(120,90,50,0.25)';
          ctx.beginPath();
          ctx.ellipse(dx2, dy2, 15, 10, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Worn battle circle
        ctx.strokeStyle = 'rgba(100,80,40,0.2)';
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.arc(el_state.px, el_state.py, 80, 0, Math.PI * 2);
        ctx.stroke();
        // Directional indicators (faint arrows showing W/A/S/D)
        if (el_state.swingT <= 0) {
          var dirs = [
            [0, -1, 'W'],
            [0, 1, 'S'],
            [-1, 0, 'A'],
            [1, 0, 'D'],
          ];
          for (var di = 0; di < 4; di++) {
            var da = dirs[di];
            ctx.fillStyle = 'rgba(240,216,120,0.15)';
            ctx.font = 'bold 14px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText(
              da[2],
              el_state.px + da[0] * 50,
              el_state.py + da[1] * 50 + 4,
            );
          }
        }
        // Enemies
        for (var i = 0; i < el_state.waveEnemies.length; i++) {
          var e = el_state.waveEnemies[i];
          if (e.dead) continue;
          var hitFlash = e.hitT > 0;
          ctx.fillStyle = hitFlash ? '#e08060' : '#6a4a3a';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = hitFlash ? '#d06040' : '#5a3a2a';
          ctx.beginPath();
          ctx.arc(e.x, e.y - 4, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#aaa';
          ctx.lineWidth = 1.5;
          var a = Math.atan2(el_state.py - e.y, el_state.px - e.x);
          if (e.swingT > 0) {
            var sw = e.swingT / 0.25;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(
              e.x + Math.cos(a + 0.3 * sw) * 12,
              e.y + Math.sin(a + 0.3 * sw) * 12,
            );
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10);
            ctx.stroke();
          }
        }
        // Player
        drawWarrior(
          el_state.px,
          el_state.py,
          el_state.dir,
          '#d4a574',
          '#3a2818',
        );
        // Sword swing - directional (not rotating)
        if (el_state.swingT > 0) {
          var prog = 1 - el_state.swingT / 0.22;
          var baseAng = (el_state.arcAngle * Math.PI) / 180;
          var sweep = swordActive() ? Math.PI / 2 : Math.PI / 3; // 60 degree sweep (90 with Goliath's sword)
          var arcR = swordActive() ? 140 : 55;
          var bladeR = swordActive() ? 150 : 62;
          var bladeW = swordActive() ? 10 : 3;
          var startA = baseAng - sweep / 2;
          var endA = baseAng - sweep / 2 + sweep * prog;
          ctx.strokeStyle =
            'rgba(240,216,120,' + (0.7 * (1 - prog)).toFixed(3) + ')';
          ctx.lineWidth = swordActive() ? 20 : 8;
          ctx.beginPath();
          ctx.arc(el_state.px, el_state.py, arcR, startA, endA);
          ctx.stroke();
          ctx.strokeStyle =
            'rgba(255,255,255,' + (0.9 * (1 - prog)).toFixed(3) + ')';
          ctx.lineWidth = swordActive() ? 6 : 2;
          ctx.beginPath();
          ctx.arc(el_state.px, el_state.py, arcR + 8, startA, endA);
          ctx.stroke();
          // Blade at current position
          var bladeAng = startA + sweep * prog;
          ctx.strokeStyle = '#c0c0d0';
          ctx.lineWidth = bladeW;
          ctx.beginPath();
          ctx.moveTo(
            el_state.px + Math.cos(bladeAng) * 12,
            el_state.py + Math.sin(bladeAng) * 12,
          );
          ctx.lineTo(
            el_state.px + Math.cos(bladeAng) * bladeR,
            el_state.py + Math.sin(bladeAng) * bladeR,
          );
          ctx.stroke();
          // Goliath's sword: add a wide guard/hilt
          if (swordActive()) {
            ctx.strokeStyle = '#8a6020';
            ctx.lineWidth = 6;
            var ga = bladeAng + Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(
              el_state.px + Math.cos(bladeAng) * 8 - Math.cos(ga) * 20,
              el_state.py + Math.sin(bladeAng) * 8 - Math.sin(ga) * 20,
            );
            ctx.lineTo(
              el_state.px + Math.cos(bladeAng) * 8 + Math.cos(ga) * 20,
              el_state.py + Math.sin(bladeAng) * 8 + Math.sin(ga) * 20,
            );
            ctx.stroke();
          }
        }
        // Wave info
        if (el_state.resting) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, H / 2 - 40, W, 80);
          ctx.fillStyle = '#f0d878';
          ctx.font = 'bold 24px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(
            'Wave ' + (el_state.wave + 1) + ' Complete!',
            W / 2,
            H / 2 - 5,
          );
          ctx.fillStyle = 'rgba(245,230,200,0.8)';
          ctx.font = '14px Georgia';
          ctx.fillText(
            'Next wave: ' + Math.ceil(el_state.restT) + 's',
            W / 2,
            H / 2 + 20,
          );
        }
      }

      // === SHAMMAH ===
      // Stone walls radiate outward from the center plot toward the field. Each of
      // the 4 walls is ~2 cells (40px) thick and has a ~2-cell-wide passageway gap
      // in its middle. Enemies are funneled through these 4 gaps into lanes.
      var SH_WALLS = [
        { x: 140, y: 140, w: 160, h: 40 },
        { x: 340, y: 140, w: 160, h: 40 },
        { x: 140, y: 460, w: 160, h: 40 },
        { x: 340, y: 460, w: 160, h: 40 },
        { x: 140, y: 180, w: 40, h: 120 },
        { x: 140, y: 340, w: 40, h: 120 },
        { x: 460, y: 180, w: 40, h: 120 },
        { x: 460, y: 340, w: 40, h: 120 },
      ];
      var SH_GAPS = [
        { x: 320, y: 160 },
        { x: 320, y: 480 },
        { x: 160, y: 320 },
        { x: 480, y: 320 },
      ];

      function shHitsWall(x, y, r) {
        for (var i = 0; i < SH_WALLS.length; i++) {
          var wl = SH_WALLS[i];
          if (
            x + r > wl.x &&
            x - r < wl.x + wl.w &&
            y + r > wl.y &&
            y - r < wl.y + wl.h
          )
            return true;
        }
        return false;
      }

      function initShammah() {
        // Player starts at the center of the field
        sh = {
          px: 320,
          py: 320,
          dir: { x: 0, y: -1 },
          atkT: 0,
          atkCD: 0,
          enemies: [],
          arrows: [],
          plotX: 300,
          plotY: 300,
          plotW: 40,
          plotH: 40,
          breaches: 0,
          maxBreaches: 5,
          wave: 0,
          spawnT: 0,
          surviveTime: 45,
          surviveT: 0,
          kills: 0,
        };
      }

      // Goliath's Sword: J swings a wide 90-degree sword arc (one-hit kills)
      function shammahSwordSwing() {
        if (sh.atkCD > 0) return;
        sh.atkCD = 0.4;
        sh.atkT = 0.3;
        for (var i = sh.enemies.length - 1; i >= 0; i--) {
          var e = sh.enemies[i];
          var dx = e.x - sh.px,
            dy = e.y - sh.py;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d <= 110 && d > 0.1) {
            var dot = (dx * sh.dir.x + dy * sh.dir.y) / d;
            if (Math.acos(Math.max(-1, Math.min(1, dot))) <= Math.PI / 2) {
              spawnParticles(e.x, e.y, '#c43030', 8);
              sh.enemies.splice(i, 1);
              sh.kills++;
              shake = 2;
            }
          }
        }
      }

      // J shoots an arrow in the facing direction
      function shootShammahArrow() {
        if (sh.atkCD > 0) return;
        sh.atkCD = 0.35;
        sh.atkT = 0.15;
        sh.arrows.push({
          x: sh.px + sh.dir.x * 14,
          y: sh.py + sh.dir.y * 14,
          vx: sh.dir.x * 420,
          vy: sh.dir.y * 420,
          life: 2,
        });
      }

      function updateShammah(dt) {
        // Movement (starts at center, can move through the passageways)
        var dx = 0,
          dy = 0;
        if (keys['arrowleft'] || keys['a']) dx = -1;
        if (keys['arrowright'] || keys['d']) dx = 1;
        if (keys['arrowup'] || keys['w']) dy = -1;
        if (keys['arrowdown'] || keys['s']) dy = 1;
        if (dx && dy) {
          dx *= 0.707;
          dy *= 0.707;
        }
        var spd = 130;
        if (dx || dy) {
          var nx = sh.px + dx * spd * dt,
            ny = sh.py + dy * spd * dt;
          if (!shHitsWall(nx, sh.py, 10))
            sh.px = Math.max(10, Math.min(W - 10, nx));
          if (!shHitsWall(sh.px, ny, 10))
            sh.py = Math.max(10, Math.min(H - 10, ny));
          if (Math.abs(dx) > Math.abs(dy))
            sh.dir = { x: dx > 0 ? 1 : -1, y: 0 };
          else sh.dir = { x: 0, y: dy > 0 ? 1 : -1 };
        }
        if (sh.atkT > 0) sh.atkT -= dt;
        if (sh.atkCD > 0) sh.atkCD -= dt;
        // Spawn enemies
        sh.spawnT += dt;
        var maxOnField = Math.min(40, 12 + sh.wave * 4);
        if (
          sh.spawnT > Math.max(0.15, 0.5 - sh.wave * 0.05) &&
          sh.enemies.length < maxOnField
        ) {
          sh.spawnT = 0;
          spawnShammahEnemy();
        }
        // Update enemies - they head for the center plot but must navigate through
        // the wall passageways
        for (var i = 0; i < sh.enemies.length; i++) {
          var e = sh.enemies[i];
          var inside = e.x > 180 && e.x < 460 && e.y > 180 && e.y < 460;
          var tx, ty;
          if (inside) {
            tx = sh.plotX + sh.plotW / 2;
            ty = sh.plotY + sh.plotH / 2;
          } else {
            var best = null,
              bd = 1e9;
            for (var g = 0; g < SH_GAPS.length; g++) {
              var gdx = e.x - SH_GAPS[g].x,
                gdy = e.y - SH_GAPS[g].y;
              var gd = Math.sqrt(gdx * gdx + gdy * gdy);
              if (gd < bd) {
                bd = gd;
                best = SH_GAPS[g];
              }
            }
            if (bd < 25) {
              tx = sh.plotX + sh.plotW / 2;
              ty = sh.plotY + sh.plotH / 2;
            } else {
              tx = best.x;
              ty = best.y;
            }
          }
          var ex = tx - e.x,
            ey = ty - e.y;
          var d = Math.sqrt(ex * ex + ey * ey);
          if (d > 2) {
            var mx = e.x + (ex / d) * 35 * dt,
              my = e.y + (ey / d) * 35 * dt;
            if (!shHitsWall(mx, my, 7)) {
              e.x = mx;
              e.y = my;
            } else if (!shHitsWall(mx, e.y, 7)) {
              e.x = mx;
            } else if (!shHitsWall(e.x, my, 7)) {
              e.y = my;
            }
          }
          // Check if reached plot
          if (
            e.x > sh.plotX &&
            e.x < sh.plotX + sh.plotW &&
            e.y > sh.plotY &&
            e.y < sh.plotY + sh.plotH
          ) {
            sh.breaches++;
            spawnParticles(e.x, e.y, '#c43030', 8);
            sh.enemies.splice(i, 1);
            shake = 4;
            i--;
            continue;
          }
        }
        // Update arrows - straight line, hit the first enemy in their path
        for (var i = sh.arrows.length - 1; i >= 0; i--) {
          var ar = sh.arrows[i];
          ar.x += ar.vx * dt;
          ar.y += ar.vy * dt;
          ar.life -= dt;
          var dead =
            ar.life <= 0 ||
            ar.x < -20 ||
            ar.x > W + 20 ||
            ar.y < -20 ||
            ar.y > H + 20 ||
            shHitsWall(ar.x, ar.y, 2);
          if (!dead) {
            var arr = goliathSwordUnlocked ? 14 : 10; // bigger arrows with Goliath's sword
            for (var j = 0; j < sh.enemies.length; j++) {
              var e2 = sh.enemies[j];
              var ddx = e2.x - ar.x,
                ddy = e2.y - ar.y;
              if (ddx * ddx + ddy * ddy < arr * arr) {
                spawnParticles(e2.x, e2.y, '#c43030', 6);
                sh.enemies.splice(j, 1);
                sh.kills++;
                shake = 2;
                // With Goliath's sword the arrow pierces through multiple enemies
                if (!goliathSwordUnlocked) {
                  dead = true;
                  break;
                }
              }
            }
          }
          if (dead) sh.arrows.splice(i, 1);
        }
        // Timer
        sh.surviveT += dt;
        sh.wave = Math.floor(sh.surviveT / 15);
        if (sh.surviveT >= sh.surviveTime) {
          completed.shammah = true;
          saveProgress();
          checkDavidUnlock();
          state = 'levelcomplete';
          keys = {};
        }
        if (sh.breaches >= sh.maxBreaches) {
          goGameOver();
          keys = {};
        }
      }

      function spawnShammahEnemy() {
        var side = Math.floor(Math.random() * 4);
        var x, y;
        if (side === 0) {
          x = Math.random() * W;
          y = -15;
        } else if (side === 1) {
          x = W + 15;
          y = Math.random() * H;
        } else if (side === 2) {
          x = Math.random() * W;
          y = H + 15;
        } else {
          x = -15;
          y = Math.random() * H;
        }
        sh.enemies.push({ x: x, y: y, atkCD: 1.0 });
      }

      function renderShammah() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#6a8a4a');
        bg.addColorStop(0.5, '#5a7a3a');
        bg.addColorStop(1, '#4a6a2a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        // Field texture - lentil rows
        for (var i = 0; i < 200; i++) {
          var gx = (i * 31) % W,
            gy = (i * 47) % H;
          ctx.fillStyle = 'rgba(50,80,20,0.35)';
          ctx.fillRect(gx, gy, 2, 2);
        }
        // Grass tufts
        for (var i = 0; i < 80; i++) {
          var gx = (i * 67) % W,
            gy = (i * 43) % H;
          ctx.fillStyle = 'rgba(60,90,30,0.3)';
          ctx.fillRect(gx, gy, 1, 3);
          ctx.fillRect(gx + 2, gy + 1, 1, 2);
        }
        // Lentil plants scattered
        for (var i = 0; i < 30; i++) {
          var lx = (i * 83) % W,
            ly = (i * 51) % H;
          ctx.fillStyle = 'rgba(80,120,40,0.4)';
          ctx.beginPath();
          ctx.arc(lx, ly, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Stone walls with passageway gaps
        for (var wIdx = 0; wIdx < SH_WALLS.length; wIdx++) {
          var wl = SH_WALLS[wIdx];
          ctx.fillStyle = '#8a7860';
          ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          for (var lx = wl.x; lx < wl.x + wl.w; lx += 20)
            ctx.fillRect(lx, wl.y, 1, wl.h);
          for (var ly = wl.y; ly < wl.y + wl.h; ly += 20)
            ctx.fillRect(wl.x, ly, wl.w, 1);
          ctx.strokeStyle = '#6a5a44';
          ctx.lineWidth = 2;
          ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
        }
        // Passageway floor markers
        ctx.fillStyle = 'rgba(240,216,120,0.18)';
        ctx.fillRect(300, 140, 40, 40);
        ctx.fillRect(300, 460, 40, 40);
        ctx.fillRect(140, 300, 40, 40);
        ctx.fillRect(460, 300, 40, 40);
        // Plot in center
        ctx.fillStyle = '#7a5a2a';
        ctx.fillRect(sh.plotX, sh.plotY, sh.plotW, sh.plotH);
        ctx.strokeStyle = '#5a3a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(sh.plotX, sh.plotY, sh.plotW, sh.plotH);
        // Lentil plants
        ctx.fillStyle = 'rgba(60,100,30,0.6)';
        for (var i2 = 0; i2 < 8; i2++) {
          var lx2 = sh.plotX + 5 + (i2 % 4) * 10,
            ly2 = sh.plotY + 5 + Math.floor(i2 / 4) * 15;
          ctx.beginPath();
          ctx.arc(lx2, ly2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        // Breach indicators
        for (var i3 = 0; i3 < sh.maxBreaches; i3++) {
          var bx = 10 + i3 * 18,
            by = 10;
          ctx.fillStyle =
            i3 < sh.breaches ? '#c43030' : 'rgba(100,100,100,0.3)';
          ctx.beginPath();
          ctx.arc(bx, by, 6, 0, Math.PI * 2);
          ctx.fill();
        }
        // Enemies
        for (var i4 = 0; i4 < sh.enemies.length; i4++) {
          var e = sh.enemies[i4];
          ctx.fillStyle = '#6a4a3a';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#5a3a2a';
          ctx.beginPath();
          ctx.arc(e.x, e.y - 3, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        // Arrows in flight: small line with arrowhead
        for (var i5 = 0; i5 < sh.arrows.length; i5++) {
          var ar = sh.arrows[i5];
          var an = Math.atan2(ar.vy, ar.vx);
          ctx.strokeStyle = '#8b6a3a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(ar.x - Math.cos(an) * 10, ar.y - Math.sin(an) * 10);
          ctx.lineTo(ar.x, ar.y);
          ctx.stroke();
          ctx.fillStyle = '#c0c0c0';
          ctx.beginPath();
          ctx.moveTo(ar.x + Math.cos(an) * 5, ar.y + Math.sin(an) * 5);
          ctx.lineTo(
            ar.x + Math.cos(an + 2.5) * 4,
            ar.y + Math.sin(an + 2.5) * 4,
          );
          ctx.lineTo(
            ar.x + Math.cos(an - 2.5) * 4,
            ar.y + Math.sin(an - 2.5) * 4,
          );
          ctx.closePath();
          ctx.fill();
        }
        // Player (Shammah) with sword (Goliath's Sword) or bow
        drawWarrior(sh.px, sh.py, sh.dir, '#d4a574', '#3a2818');
        if (swordActive()) {
          var baS = Math.atan2(sh.dir.y, sh.dir.x);
          if (sh.atkT > 0) {
            var progS = 1 - sh.atkT / 0.3;
            var sweepS = Math.PI / 2;
            var startS = baS - sweepS / 2;
            ctx.strokeStyle =
              'rgba(240,216,120,' + (0.7 * (1 - progS)).toFixed(3) + ')';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(sh.px, sh.py, 55, startS, startS + sweepS * progS);
            ctx.stroke();
            var blS = startS + sweepS * progS;
            ctx.strokeStyle = '#c0c0d0';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(sh.px + Math.cos(blS) * 12, sh.py + Math.sin(blS) * 12);
            ctx.lineTo(sh.px + Math.cos(blS) * 65, sh.py + Math.sin(blS) * 65);
            ctx.stroke();
          } else {
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sh.px + Math.cos(baS) * 6, sh.py + Math.sin(baS) * 6);
            ctx.lineTo(sh.px + Math.cos(baS) * 14, sh.py + Math.sin(baS) * 14);
            ctx.stroke();
            ctx.strokeStyle = '#c0c0d0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sh.px + Math.cos(baS) * 14, sh.py + Math.sin(baS) * 14);
            ctx.lineTo(sh.px + Math.cos(baS) * 50, sh.py + Math.sin(baS) * 50);
            ctx.stroke();
          }
          return;
        }
        var ba = Math.atan2(sh.dir.y, sh.dir.x);
        var bx2 = sh.px + sh.dir.x * 10,
          by2 = sh.py + sh.dir.y * 10;
        ctx.strokeStyle = '#5a3a2a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bx2, by2, 9, ba - Math.PI / 2.2, ba + Math.PI / 2.2);
        ctx.stroke();
        ctx.strokeStyle = '#d8d0c0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(
          bx2 + Math.cos(ba - Math.PI / 2.2) * 9,
          by2 + Math.sin(ba - Math.PI / 2.2) * 9,
        );
        ctx.lineTo(
          bx2 + Math.cos(ba + Math.PI / 2.2) * 9,
          by2 + Math.sin(ba + Math.PI / 2.2) * 9,
        );
        ctx.stroke();
        // Nocked arrow
        ctx.strokeStyle = '#8b6a3a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bx2 - Math.cos(ba) * 6, by2 - Math.sin(ba) * 6);
        ctx.lineTo(
          bx2 + Math.cos(ba) * (sh.atkT > 0 ? 16 : 10),
          by2 + Math.sin(ba) * (sh.atkT > 0 ? 16 : 10),
        );
        ctx.stroke();
      }

      // === DAVID vs GOLIATH ===
      // Hold J to spin the sling (power 0-100), release J to throw.
      // W/S adjust the angle, A/D move David along the ground.
      // SPACE is menu navigation only. Goliath's shield moves across his face;
      // time the throw for when the target is exposed.
      function initDavid() {
        if (goliathSwordUnlocked && swordEnabled) {
          dv = {
            angle: 0,
            power: 0,
            charging: false,
            stones: 5,
            thrown: [],
            px: 100,
            py: 500,
            goliathX: 400,
            goliathY: 480,
            goliathHeadR: 28,
            phase: 'sword_fight',
            msg: '',
            hitT: 0,
            shieldT: 0,
            shieldMode: 'open',
            swordT: 0,
            swordSwingT: 0,
            swordSwingCD: 0,
            goliathHP: 1,
            goliathDown: true,
          };
        } else {
          dv = {
            angle: 35,
            power: 0,
            charging: false,
            stones: 5,
            thrown: [],
            px: 100,
            py: 500,
            goliathX: 520,
            goliathY: 340,
            goliathHeadR: 24,
            phase: 'aim',
            msg: '',
            hitT: 0,
            shieldT: 0,
            shieldMode: 'open',
            swordT: 0,
          };
        }
      }

      function throwStone() {
        if (dv.phase !== 'aim' || dv.stones <= 0) return;
        var rad = (dv.angle * Math.PI) / 180;
        var v = 300 + dv.power * 3; // power scales the stone's velocity
        dv.thrown.push({
          x: dv.px + 18,
          y: dv.py - 10,
          vx: Math.cos(rad) * v,
          vy: -Math.sin(rad) * v,
          life: 4,
          trail: [],
        });
        dv.stones--;
        dv.power = 0;
        dv.phase = 'flying';
      }

      // The shield only blocks the part of the face it is covering
      function shieldBlocksHead(stone) {
        if (dv.shieldMode === 'open') return false;
        if (dv.shieldMode === 'left') return stone.x <= dv.goliathX;
        return stone.x > dv.goliathX;
      }

      function updateDavid(dt) {
        // Sword fight mode
        if (dv.phase === 'sword_fight') {
          if (keys['arrowleft'] || keys['a']) dv.px -= 100 * dt;
          if (keys['arrowright'] || keys['d']) dv.px += 100 * dt;
          if (keys['arrowup'] || keys['w']) dv.py -= 100 * dt;
          if (keys['arrowdown'] || keys['s']) dv.py += 100 * dt;
          dv.px = Math.max(20, Math.min(W - 20, dv.px));
          dv.py = Math.max(H * 0.4, Math.min(H - 20, dv.py));
          // Goliath is laying on the ground, doesn't move
          if (dv.swordSwingT > 0) dv.swordSwingT -= dt;
          if (dv.swordSwingCD > 0) dv.swordSwingCD -= dt;
          if ((keys['j'] || keys['k']) && dv.swordSwingCD <= 0) {
            dv.swordSwingT = 0.35;
            dv.swordSwingCD = 0.5;
            var headX = dv.goliathX + 40,
              headY = dv.goliathY - 20;
            var dist = Math.sqrt((dv.px - headX) ** 2 + (dv.py - headY) ** 2);
            if (dist < 70) {
              dv.goliathHP--;
              shake = 6;
              spawnParticles(dv.goliathX, dv.goliathY - 40, '#f0d878', 15);
              if (dv.goliathHP <= 0) {
                dv.phase = 'hit';
                dv.msg = 'ONE STRIKE!';
                dv.hitT = 2;
                shake = 10;
                spawnParticles(dv.goliathX, dv.goliathY, '#f0d878', 30);
              }
            }
          }
          if (dv.phase === 'hit') {
            dv.hitT -= dt;
            if (dv.hitT <= 0) {
              davidVictory = true;
              goliathSwordUnlocked = true;
              if (!swordEnabled) swordEnabled = true;
              saveProgress();
              state = 'davidvictory';
            }
          }
          return;
        }
        // Power builds while J is held
        if (dv.charging && dv.phase === 'aim' && dv.stones > 0) {
          dv.power = Math.min(100, dv.power + dt * 60);
        }
        // Aim angle + movement along the ground (left portion of the screen)
        if (dv.phase === 'aim') {
          if (keys['arrowup'] || keys['w'])
            dv.angle = Math.min(80, dv.angle + 30 * dt);
          if (keys['arrowdown'] || keys['s'])
            dv.angle = Math.max(10, dv.angle - 30 * dt);
          var mvx = 0;
          if (keys['arrowleft'] || keys['a']) mvx = -1;
          if (keys['arrowright'] || keys['d']) mvx = 1;
          if (mvx) dv.px = Math.max(40, Math.min(300, dv.px + mvx * 90 * dt));
        }
        // Goliath's shield pattern: cover left, cover right, then open (repeat)
        dv.shieldT += dt;
        var cyc = dv.shieldT % 3.2;
        if (cyc < 1.2) dv.shieldMode = 'left';
        else if (cyc < 2.4) dv.shieldMode = 'right';
        else dv.shieldMode = 'open';
        // Decorative (but threatening) sword swing
        dv.swordT += dt;

        if (dv.phase === 'flying') {
          for (var i = 0; i < dv.thrown.length; i++) {
            var s = dv.thrown[i];
            s.trail.push({ x: s.x, y: s.y });
            if (s.trail.length > 15) s.trail.shift();
            s.life -= dt;
            // Sub-steps so fast stones cannot tunnel through the head
            var steps = 4;
            for (var st = 0; st < steps && s.life > 0; st++) {
              s.x += (s.vx * dt) / steps;
              s.y += (s.vy * dt) / steps;
              s.vy += (600 * dt) / steps; // gravity
              // Head hit check (only counts if the shield is not blocking)
              var hx = dv.goliathX,
                hy = dv.goliathY - 60;
              var dxh = s.x - hx,
                dyh = s.y - hy;
              if (Math.sqrt(dxh * dxh + dyh * dyh) < dv.goliathHeadR) {
                if (!shieldBlocksHead(s)) {
                  dv.phase = 'hit';
                  dv.msg = 'DIRECT HIT!';
                  dv.hitT = 2;
                  dv.charging = false;
                  shake = 8;
                  spawnParticles(hx, hy, '#f0d878', 20);
                  return;
                } else {
                  dv.msg = 'Blocked by the shield!';
                  spawnParticles(s.x, s.y, '#c0c0c0', 8);
                  s.life = 0;
                }
              }
              // Body hit (not a win)
              if (
                s.life > 0 &&
                Math.abs(s.x - dv.goliathX) < 28 &&
                s.y > dv.goliathY - 32 &&
                s.y < dv.goliathY + 80
              ) {
                dv.msg = 'Body hit - need a head shot!';
                spawnParticles(s.x, s.y, '#aaa', 6);
                s.life = 0;
              }
              // Off screen
              if (s.y > H + 50 || s.x > W + 50 || s.x < -50) s.life = 0;
            }
          }
          dv.thrown = dv.thrown.filter(function (s2) {
            return s2.life > 0;
          });
          if (dv.thrown.length === 0) {
            if (dv.stones > 0) {
              dv.phase = 'aim';
              dv.msg = '';
            } else dv.phase = 'missed';
          }
        }
        if (dv.phase === 'hit') {
          dv.hitT -= dt;
          if (dv.hitT <= 0) {
            davidVictory = true;
            goliathSwordUnlocked = true; // the mighty men take up Goliath's sword
            if (!swordEnabled) swordEnabled = true;
            saveProgress();
            state = 'davidvictory';
          }
        }
        if (dv.phase === 'missed') {
          goGameOver();
        }
      }

      function drawGoliathShield(sx, sy) {
        ctx.fillStyle = '#8a7848';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 14, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5a4a3a';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#6a5a38';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function renderDavid() {
        if (
          dv.phase === 'sword_fight' ||
          (dv.phase === 'hit' && dv.goliathHP !== undefined)
        ) {
          var bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#6a8aaa');
          bg.addColorStop(0.5, '#8a9a7a');
          bg.addColorStop(1, '#5a6a4a');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#7a8a5a';
          ctx.fillRect(0, H * 0.65, W, H * 0.35);
          var gx = dv.goliathX,
            gy = dv.goliathY;
          var headX = gx + 40,
            headY = gy - 20;
          // Body laying down (drawn under the blade)
          ctx.fillStyle = '#6a5a4a';
          ctx.fillRect(gx, gy - 15, 100, 30);
          ctx.fillStyle = '#5a4a3a';
          ctx.fillRect(gx, gy - 15, 100, 6);
          ctx.fillStyle = '#4a3a2a';
          ctx.fillRect(gx + 20, gy - 12, 50, 24);
          ctx.fillStyle = '#6a5a4a';
          ctx.fillRect(gx + 95, gy - 10, 60, 15);
          drawWarrior(dv.px, dv.py, { x: 1, y: 0 }, '#d4a574', '#2a1808');
          var neckY = headY + 8;
          var slashA = Math.atan2((neckY - dv.py) * 0.2, headX - dv.px);
          function drawBlade(ang, len) {
            var hx2 = dv.px + Math.cos(ang) * 14;
            var hy2 = dv.py + Math.sin(ang) * 14;
            var tx = dv.px + Math.cos(ang) * len;
            var ty = dv.py + Math.sin(ang) * len;
            ctx.strokeStyle = '#6a4a2a';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(
              dv.px - Math.cos(ang) * 8,
              dv.py - Math.sin(ang) * 8,
            );
            ctx.lineTo(hx2, hy2);
            ctx.stroke();
            ctx.strokeStyle = '#c0c0d0';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(hx2, hy2);
            ctx.lineTo(tx, ty);
            ctx.stroke();
          }
          if (dv.swordSwingT > 0) {
            var prog = 1 - dv.swordSwingT / 0.35;
            var startA = slashA - 0.35;
            var sweep = 0.7;
            var bladeAng = startA + sweep * prog;
            ctx.strokeStyle =
              'rgba(240,216,120,' + (0.7 * (1 - prog)).toFixed(3) + ')';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.arc(dv.px, dv.py, 110, startA, startA + sweep * Math.max(prog, 0.08));
            ctx.stroke();
            drawBlade(bladeAng, 128);
          } else {
            drawBlade(slashA, 108);
          }
          // Head on top so the blade tucks behind it
          ctx.fillStyle = '#c4a074';
          ctx.beginPath();
          ctx.arc(headX, headY, dv.goliathHeadR, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#5a4a3a';
          ctx.beginPath();
          ctx.arc(headX, headY - 3, dv.goliathHeadR - 3, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#333';
          ctx.fillRect(headX - 8, headY - 5, 3, 3);
          ctx.fillRect(headX + 5, headY - 5, 3, 3);
          ctx.strokeStyle = 'rgba(240,80,80,0.5)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(headX, headY, dv.goliathHeadR + 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(245,230,200,0.7)';
          ctx.font = 'bold 14px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(
            'Walk to Goliath\u2019s head and strike! (J to swing, WASD to move)',
            W / 2,
            30,
          );
          if (dv.msg) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, H / 2 - 30, W, 60);
            ctx.fillStyle = '#5cb85c';
            ctx.font = 'bold 28px Georgia';
            ctx.fillText(dv.msg, W / 2, H / 2 + 8);
          }
          return;
        }
        // Valley background
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#6a8aaa');
        bg.addColorStop(0.5, '#8a9a7a');
        bg.addColorStop(1, '#5a6a4a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        // Ground
        ctx.fillStyle = '#7a8a5a';
        ctx.fillRect(0, H * 0.65, W, H * 0.35);
        // Distant hills
        ctx.fillStyle = '#5a6a4a';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.5);
        for (var i = 0; i <= W; i += 40) {
          ctx.lineTo(i, H * 0.5 - Math.sin(i * 0.02) * 30);
        }
        ctx.lineTo(W, H * 0.65);
        ctx.lineTo(0, H * 0.65);
        ctx.closePath();
        ctx.fill();

        // Goliath (large figure on right)
        var gx = dv.goliathX,
          gy = dv.goliathY;
        // Body
        ctx.fillStyle = '#6a5a4a';
        ctx.fillRect(gx - 25, gy - 30, 50, 80);
        // Armor
        ctx.fillStyle = '#5a4a3a';
        ctx.fillRect(gx - 25, gy - 30, 50, 35);
        ctx.fillStyle = '#4a3a2a';
        ctx.fillRect(gx - 25, gy - 30, 50, 5);
        // Legs
        ctx.fillStyle = '#6a5a4a';
        ctx.fillRect(gx - 20, gy + 50, 16, 35);
        ctx.fillRect(gx + 4, gy + 50, 16, 35);
        // Head
        var hy2 = gy - 60;
        ctx.fillStyle = '#c4a074';
        ctx.beginPath();
        ctx.arc(gx, hy2, dv.goliathHeadR, 0, Math.PI * 2);
        ctx.fill();
        // Helmet
        ctx.fillStyle = '#5a4a3a';
        ctx.beginPath();
        ctx.arc(gx, hy2 - 5, dv.goliathHeadR - 2, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(gx - dv.goliathHeadR, hy2 - 7, dv.goliathHeadR * 2, 4);
        // Face
        ctx.fillStyle = '#333';
        ctx.fillRect(gx - 8, gy - 62, 3, 3);
        ctx.fillRect(gx + 5, gy - 62, 3, 3);
        ctx.strokeStyle = '#5a3a2a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gx - 5, gy - 52);
        ctx.lineTo(gx + 5, gy - 52);
        ctx.stroke();
        // Sword (decorative but threatening) - swings slowly
        var swA = -0.6 + Math.sin(dv.swordT * 2) * 0.5;
        var shx = gx + 28,
          shy = gy - 25;
        ctx.strokeStyle = '#5a3a2a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(shx, shy);
        ctx.lineTo(shx + Math.cos(swA) * 55, shy + Math.sin(swA) * 55);
        ctx.stroke();
        ctx.strokeStyle = '#c0c0c0';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(shx + Math.cos(swA) * 15, shy + Math.sin(swA) * 15);
        ctx.lineTo(shx + Math.cos(swA) * 70, shy + Math.sin(swA) * 70);
        ctx.stroke();
        // Shield: moves to protect parts of the face; lowered when open
        if (dv.shieldMode === 'left') {
          drawGoliathShield(gx - dv.goliathHeadR * 0.8, hy2);
        } else if (dv.shieldMode === 'right') {
          drawGoliathShield(gx + dv.goliathHeadR * 0.8, hy2);
        } else {
          drawGoliathShield(gx - 38, gy + 5);
        }
        // Highlight head target + exposed side (visible while aiming)
        if (dv.phase === 'aim') {
          ctx.strokeStyle = 'rgba(240,80,80,0.5)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(gx, hy2, dv.goliathHeadR + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // David (small figure on the left, can move along the ground)
        var dx = dv.px,
          dy = dv.py;
        ctx.fillStyle = '#d4a574';
        ctx.beginPath();
        ctx.arc(dx, dy - 15, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3a2818';
        ctx.beginPath();
        ctx.arc(dx, dy - 19, 8, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#e8e0d0';
        ctx.fillRect(dx - 10, dy - 8, 20, 25);
        ctx.fillStyle = '#8b6a3a';
        ctx.fillRect(dx - 9, dy + 3, 18, 3);
        ctx.fillStyle = '#d4a574';
        ctx.fillRect(dx - 12, dy - 5, 4, 12);
        ctx.fillRect(dx + 8, dy - 5, 4, 12);
        // Sling
        ctx.strokeStyle = '#5a3a2a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(dx + 12, dy - 2);
        ctx.lineTo(dx + 22, dy - 8);
        ctx.stroke();
        if (dv.phase === 'aim') {
          ctx.fillStyle = '#8a7a5a';
          ctx.beginPath();
          ctx.arc(dx + 22, dy - 8, 3, 0, Math.PI * 2);
          ctx.fill();
          if (dv.charging) {
            // Spinning sling while charging
            ctx.strokeStyle = '#8a7a5a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(
              dx + 22,
              dy - 8,
              6 + Math.sin(animTime * 15) * 2,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
          }
        }
        // Power meter: vertical bar next to David
        if (dv.charging || dv.power > 0) {
          var pbx = dx - 42,
            pby = dy - 48,
            pbw = 10,
            pbh = 66;
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(pbx, pby, pbw, pbh);
          var ph = (pbh * dv.power) / 100;
          ctx.fillStyle = dv.power > 70 ? '#e08030' : '#f0d878';
          ctx.fillRect(
            pbx + 1,
            pby + pbh - Math.max(1, ph - 1),
            pbw - 2,
            Math.max(1, ph - 2),
          );
          ctx.strokeStyle = '#f0d878';
          ctx.lineWidth = 1;
          ctx.strokeRect(pbx, pby, pbw, pbh);
        }

        // Stones in flight
        for (var i2 = 0; i2 < dv.thrown.length; i2++) {
          var st2 = dv.thrown[i2];
          for (var t = 0; t < st2.trail.length; t++) {
            ctx.globalAlpha = (t / st2.trail.length) * 0.5;
            ctx.fillStyle = '#8a7a5a';
            ctx.beginPath();
            ctx.arc(st2.trail[t].x, st2.trail[t].y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#6a5a4a';
          ctx.beginPath();
          ctx.arc(st2.x, st2.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#4a3a2a';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        // Aim indicator: dotted trajectory scaled with power
        if (dv.phase === 'aim') {
          var rad = (dv.angle * Math.PI) / 180;
          var v = 300 + dv.power * 3;
          ctx.strokeStyle = 'rgba(240,216,120,0.4)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          var first = true;
          for (var t2 = 0; t2 < 2.2; t2 += 0.05) {
            var tx = dx + 18 + Math.cos(rad) * v * t2;
            var ty = dy - 10 - Math.sin(rad) * v * t2 + 300 * t2 * t2;
            if (ty > H) break;
            if (first) {
              ctx.moveTo(tx, ty);
              first = false;
            } else ctx.lineTo(tx, ty);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#f0d878';
          ctx.font = 'bold 14px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(
            'Angle: ' +
              Math.round(dv.angle) +
              '\u00b0 \u2014 Hold J to charge, release to throw',
            W / 2,
            30,
          );
          ctx.fillText(
            'Stones: ' +
              dv.stones +
              '/5 \u00b7 Power: ' +
              Math.round(dv.power) +
              '%',
            W / 2,
            50,
          );
          if (dv.shieldMode !== 'open') {
            ctx.fillStyle = 'rgba(245,230,200,0.7)';
            ctx.font = '12px Georgia';
            ctx.fillText(
              'Shield covering the ' +
                (dv.shieldMode === 'left' ? 'left' : 'right') +
                ' of Goliath\u2019s face',
              W / 2,
              70,
            );
          } else {
            ctx.fillStyle = '#f0d878';
            ctx.font = 'bold 12px Georgia';
            ctx.fillText('Shield lowered \u2014 throw NOW!', W / 2, 70);
          }
        }

        // Hit/miss messages
        if (dv.msg) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, H / 2 - 30, W, 60);
          ctx.fillStyle = dv.phase === 'hit' ? '#5cb85c' : '#e74c3c';
          ctx.font = 'bold 28px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(dv.msg, W / 2, H / 2 + 8);
        }
      }

      // === SHARED DRAW HELPERS ===
      function drawWarrior(x, y, dir, skin, hair) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y + 14, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        // Body (tunic)
        ctx.fillStyle = '#e8e0d0';
        ctx.fillRect(x - 8, y - 4, 16, 18);
        // Belt
        ctx.fillStyle = '#8b6a3a';
        ctx.fillRect(x - 8, y + 4, 16, 3);
        // Arms
        ctx.fillStyle = skin;
        ctx.fillRect(x - 11, y - 2, 4, 10);
        ctx.fillRect(x + 7, y - 2, 4, 10);
        // Head
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(x, y - 10, 7, 0, Math.PI * 2);
        ctx.fill();
        // Hair
        ctx.fillStyle = hair;
        ctx.beginPath();
        ctx.arc(x, y - 13, 7, Math.PI, 0);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#333';
        var ex = dir.x * 1.5,
          ey = dir.y * 1;
        ctx.fillRect(x - 3 + ex, y - 11 + ey, 2, 2);
        ctx.fillRect(x + 1 + ex, y - 11 + ey, 2, 2);
      }

      function spawnParticles(x, y, color, count) {
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2,
            s = 60 + Math.random() * 100;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 50,
            life: 0.6 + Math.random() * 0.4,
            color: color,
            size: 2 + Math.random() * 3,
          });
        }
      }

      function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawPopups() {
        for (var i = 0; i < popups.length; i++) {
          var p = popups[i];
          ctx.globalAlpha = Math.min(1, p.life);
          ctx.fillStyle = p.color || '#f0d878';
          ctx.font = 'bold 12px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(p.text, p.x, p.y - (1 - p.life) * 20);
        }
        ctx.globalAlpha = 1;
      }

      // === HUD ===
      function updateHUD() {
        // Character select shows progress info instead of game stats
        if (state === 'charselect') {
          var doneCs =
            (completed.josheb ? 1 : 0) +
            (completed.eleazar ? 1 : 0) +
            (completed.shammah ? 1 : 0);
          hudLabelMode.textContent = 'Characters';
          hudLabelStat.textContent = waterQuestUnlocked
            ? 'Water Quest'
            : '???';
          hudLabelHealth.textContent = davidUnlocked ? 'David' : '???';
          hudLabelInfo.textContent = goliathSwordUnlocked
            ? "Goliath's Sword"
            : '???';
          hudMode.textContent = doneCs + '/3';
          hudStat.textContent = davidVictory
            ? 'Completed'
            : waterQuestUnlocked
              ? 'Available'
              : '???';
          hudVal3.textContent = davidVictory
            ? 'Completed'
            : davidUnlocked
              ? 'Available'
              : '???';
          hudInfo.textContent = goliathSwordUnlocked ? 'Unlocked' : '???';
          setHudBarVisible(false);
          return;
        }
        // HUD only shows during active gameplay
        if (
          state !== 'playing' &&
          state !== 'david_fight' &&
          state !== 'water_quest'
        ) {
          setPlaceholderHud();
          return;
        }
        hudLabelMode.textContent = 'Mode';
        hudLabelStat.textContent = 'Stat';
        hudLabelHealth.textContent = 'Health';
        hudLabelInfo.textContent = 'Info';
        hudVal3.textContent = '';
        setHudBarVisible(true);
        if (state === 'playing' && selectedChar === 'josheb') {
          hudMode.textContent = 'Josheb';
          hudStat.textContent = jb.kills + '/' + jb.total;
          hudBar.style.width = jb.health + '%';
          hudBar.style.background = '#c43030';
          hudInfo.textContent = 'HP: ' + Math.round(jb.health);
        } else if (state === 'playing' && selectedChar === 'eleazar') {
          hudMode.textContent = 'Eleazar';
          hudStat.textContent =
            'Wave ' + (el_state.wave + 1) + '/' + (el_state.maxWaves + 1);
          hudBar.style.width = el_state.health + '%';
          hudBar.style.background = '#c43030';
          hudInfo.textContent =
            'HP: ' +
            Math.round(el_state.health) +
            ' Kills: ' +
            el_state.enemiesKilled;
        } else if (state === 'playing' && selectedChar === 'shammah') {
          hudMode.textContent = 'Shammah';
          hudStat.textContent =
            Math.ceil(sh.surviveTime - sh.surviveT) + 's left';
          hudBar.style.width =
            ((sh.maxBreaches - sh.breaches) / sh.maxBreaches) * 100 + '%';
          hudBar.style.background = '#5cb85c';
          hudInfo.textContent =
            'Breaches: ' + sh.breaches + '/' + sh.maxBreaches;
        } else if (state === 'david_fight') {
          hudMode.textContent = 'David';
          hudLabelStat.textContent = 'Stat';
          hudLabelHealth.textContent = 'Health';
          hudLabelInfo.textContent = 'Info';
          if (
            dv.phase === 'sword_fight' ||
            (dv.phase === 'hit' && dv.goliathHP !== undefined)
          ) {
            hudStat.textContent = 'Goliath';
            hudVal3.textContent = 'Down';
            setHudBarVisible(false);
            hudInfo.textContent =
              dv.phase === 'hit' ? 'Victory!' : 'Finish Him';
          } else {
            hudStat.textContent = 'Stones: ' + dv.stones + '/5';
            hudBar.style.width = (dv.stones / 5) * 100 + '%';
            hudBar.style.background = '#f0d878';
            setHudBarVisible(true);
            hudVal3.textContent = '';
            hudInfo.textContent = dv.charging
              ? 'Charging... release J to throw!'
              : dv.phase === 'aim'
                ? 'Hold J to charge'
                : dv.phase === 'flying'
                  ? 'Stone in flight'
                  : dv.phase === 'hit'
                    ? 'Direct hit!'
                    : dv.phase === 'missed'
                      ? 'Out of stones'
                      : '';
          }
        } else if (state === 'water_quest') {
          var avgHp = (wq.healths[0] + wq.healths[1] + wq.healths[2]) / 3;
          hudMode.textContent = 'Water Quest';
          hudStat.textContent = wq.hasWater ? 'Return!' : 'Get water';
          hudBar.style.width = Math.max(0, avgHp) + '%';
          hudBar.style.background = '#c43030';
          hudInfo.textContent = 'Kills: ' + wq.kills;
        } else {
          hudMode.textContent = '';
          hudStat.textContent = '';
          hudBar.style.width = '100%';
          hudInfo.textContent = '';
        }
      }

      // === WATER QUEST (all 3 warriors) ===
      // Winding path: stone walls form a zigzag corridor from the cave (left) to
      // the water (right). Enemies pour in through openings in the path walls.
      // J = sword (Eleazar), K = spear (Josheb), L = arrow (Shammah) - each weapon
      // has its own cooldown (swordCD/spearCD/arrowCD) so all three can be used
      // concurrently. Win if at least 1 warrior reaches the cave with water.
      var WQ_WALLS = [
        { x: 150, y: 0, w: 40, h: 430 }, // pass under (bottom gap)
        { x: 310, y: 210, w: 40, h: 430 }, // pass over (top gap)
        { x: 470, y: 0, w: 40, h: 430 }, // pass under (bottom gap)
      ];
      var WQ_OPENINGS = [
        { x: 170, y: 540 },
        { x: 330, y: 110 },
        { x: 490, y: 540 },
      ];

      function wqHitsWall(x, y, r) {
        for (var i = 0; i < WQ_WALLS.length; i++) {
          var wl = WQ_WALLS[i];
          if (
            x + r > wl.x &&
            x - r < wl.x + wl.w &&
            y + r > wl.y &&
            y - r < wl.y + wl.h
          )
            return true;
        }
        return false;
      }

      function initWaterQuest() {
        wq = {
          px: 50,
          py: 320,
          dir: { x: 1, y: 0 },
          enemies: [],
          kills: 0,
          healths: [100, 100, 100],
          spawnT: 0,
          hasWater: false,
          waterX: 590,
          waterY: 320,
          caveX: 30,
          caveY: 320,
          phase: 'fight',
          msg: '',
          msgT: 0,
          swordCD: 0,
          spearCD: 0,
          arrowCD: 0,
          swordT: 0,
          spearT: 0,
          charNames: ['Josheb', 'Eleazar', 'Shammah'],
          arrows: [],
        };
        // Pre-populate the winding path with enemies
        for (var i = 0; i < 60; i++) spawnWQEnemy(true);
      }

      function spawnWQEnemy(spread) {
        var x, y, t;
        if (spread) {
          x = 80 + Math.random() * 480;
          y = 30 + Math.random() * 580;
          for (t = 0; t < 20 && wqHitsWall(x, y, 8); t++) {
            x = 80 + Math.random() * 480;
            y = 30 + Math.random() * 580;
          }
        } else {
          // Spawn from openings along the path walls (not the screen edges)
          var o = WQ_OPENINGS[Math.floor(Math.random() * WQ_OPENINGS.length)];
          x = o.x + (Math.random() - 0.5) * 50;
          y = o.y + (Math.random() - 0.5) * 50;
          for (t = 0; t < 20 && wqHitsWall(x, y, 8); t++) {
            y = o.y + (Math.random() - 0.5) * 50;
          }
        }
        wq.enemies.push({ x: x, y: y, atkCD: 1.0 });
      }

      // K = spear (Josheb, index 0), J = sword (Eleazar, index 1)
      function wqAttack(type) {
        if (type === 'spear') {
          if (wq.healths[0] <= 0) return; // downed warrior cannot attack
          if (wq.spearCD > 0) return;
          wq.spearCD = 0.35;
          wq.spearT = 0.3;
          var reach = goliathSwordUnlocked ? 180 : 95;
          var width = goliathSwordUnlocked ? 20 : 14;
          // Long straight stab in the facing direction
          for (var i = wq.enemies.length - 1; i >= 0; i--) {
            var e = wq.enemies[i];
            var dx = e.x - wq.px,
              dy = e.y - wq.py;
            var along = dx * wq.dir.x + dy * wq.dir.y;
            var perp = Math.abs(dx * wq.dir.y - dy * wq.dir.x);
            if (along > 0 && along < reach && perp < width) {
              spawnParticles(e.x, e.y, '#c43030', 8);
              wq.enemies.splice(i, 1);
              wq.kills++;
              shake = 2;
            }
          }
        } else {
          if (wq.healths[1] <= 0) return; // downed warrior cannot attack
          if (wq.swordCD > 0) return;
          wq.swordCD = 0.35;
          wq.swordT = 0.3;
          var reach2 = swordActive() ? 165 : goliathSwordUnlocked ? 120 : 62;
          var maxAng = swordActive()
            ? Math.PI / 2
            : goliathSwordUnlocked
              ? Math.PI / 4
              : Math.PI / 8;
          // Medium arc in front
          for (var j = wq.enemies.length - 1; j >= 0; j--) {
            var e2 = wq.enemies[j];
            var dx2 = e2.x - wq.px,
              dy2 = e2.y - wq.py;
            var d = Math.sqrt(dx2 * dx2 + dy2 * dy2);
            if (d > reach2 || d < 1) continue;
            var dot = (dx2 * wq.dir.x + dy2 * wq.dir.y) / d;
            var angDiff = Math.acos(Math.max(-1, Math.min(1, dot)));
            if (angDiff <= maxAng) {
              spawnParticles(e2.x, e2.y, '#c43030', 8);
              wq.enemies.splice(j, 1);
              wq.kills++;
              shake = 2;
            }
          }
        }
      }

      // L = Shammah's arrow shot
      function wqShootArrow() {
        if (wq.healths[2] <= 0) return; // downed warrior cannot attack
        if (wq.arrowCD > 0) return;
        wq.arrowCD = 0.4;
        wq.arrows.push({
          x: wq.px + wq.dir.x * 14,
          y: wq.py + wq.dir.y * 14,
          vx: wq.dir.x * 400,
          vy: wq.dir.y * 400,
          life: 2,
          pierce: goliathSwordUnlocked,
          r: goliathSwordUnlocked ? 21 : 10,
        });
      }

      function updateWaterQuest(dt) {
        // Independent cooldowns per weapon
        if (wq.swordCD > 0) wq.swordCD -= dt;
        if (wq.spearCD > 0) wq.spearCD -= dt;
        if (wq.arrowCD > 0) wq.arrowCD -= dt;
        if (wq.swordT > 0) wq.swordT -= dt;
        if (wq.spearT > 0) wq.spearT -= dt;
        if (wq.msgT > 0) wq.msgT -= dt;
        // Movement (all 3 warriors move together as a group; walls block movement)
        var dx = 0,
          dy = 0;
        if (keys['arrowleft'] || keys['a']) dx = -1;
        if (keys['arrowright'] || keys['d']) dx = 1;
        if (keys['arrowup'] || keys['w']) dy = -1;
        if (keys['arrowdown'] || keys['s']) dy = 1;
        if (dx && dy) {
          dx *= 0.707;
          dy *= 0.707;
        }
        var spd = 120;
        if (dx || dy) {
          var nx = wq.px + dx * spd * dt,
            ny = wq.py + dy * spd * dt;
          if (!wqHitsWall(nx, wq.py, 10))
            wq.px = Math.max(15, Math.min(W - 15, nx));
          if (!wqHitsWall(wq.px, ny, 10))
            wq.py = Math.max(15, Math.min(H - 15, ny));
          if (Math.abs(dx) > Math.abs(dy))
            wq.dir = { x: dx > 0 ? 1 : -1, y: 0 };
          else wq.dir = { x: 0, y: dy > 0 ? 1 : -1 };
        }
        // Spawn enemies from the path openings
        wq.spawnT += dt;
        if (wq.spawnT > 0.12 && wq.enemies.length < 480) {
          wq.spawnT = 0;
          spawnWQEnemy(false);
        }
        // Update enemies - they attack the nearest living warrior
        var offs = [
          [-6, 6],
          [6, 6],
          [0, -6],
        ];
        for (var i = 0; i < wq.enemies.length; i++) {
          var e = wq.enemies[i];
          var ti = -1,
            td = 1e9;
          for (var c = 0; c < 3; c++) {
            if (wq.healths[c] <= 0) continue;
            var cdx = e.x - (wq.px + offs[c][0]),
              cdy = e.y - (wq.py + offs[c][1]);
            var cdd = cdx * cdx + cdy * cdy;
            if (cdd < td) {
              td = cdd;
              ti = c;
            }
          }
          if (ti < 0) break; // everyone is down
          var wx = wq.px + offs[ti][0],
            wy = wq.py + offs[ti][1];
          var ex = wx - e.x,
            ey = wy - e.y;
          var d = Math.sqrt(ex * ex + ey * ey);
          if (d > 1) {
            var mx = e.x + (ex / d) * 35 * dt,
              my = e.y + (ey / d) * 35 * dt;
            if (!wqHitsWall(mx, my, 7)) {
              e.x = mx;
              e.y = my;
            } else if (!wqHitsWall(mx, e.y, 7)) {
              e.x = mx;
            } else if (!wqHitsWall(e.x, my, 7)) {
              e.y = my;
            }
          }
          e.atkCD -= dt;
          if (d < 26 && e.atkCD <= 0) {
            e.atkCD = 1.0;
            wq.healths[ti] -= 4;
            shake = 2;
            spawnParticles(wx, wy, '#c43030', 4);
          }
        }
        // Update arrows (Shammah's shots) - pierce through enemies with Goliath's sword
        for (var a = wq.arrows.length - 1; a >= 0; a--) {
          var ar = wq.arrows[a];
          ar.x += ar.vx * dt;
          ar.y += ar.vy * dt;
          ar.life -= dt;
          var dead =
            ar.life <= 0 ||
            ar.x < -20 ||
            ar.x > W + 20 ||
            ar.y < -20 ||
            ar.y > H + 20 ||
            wqHitsWall(ar.x, ar.y, 2);
          if (!dead) {
            for (var j2 = 0; j2 < wq.enemies.length; j2++) {
              var e3 = wq.enemies[j2];
              var ddx = e3.x - ar.x,
                ddy = e3.y - ar.y;
              if (ddx * ddx + ddy * ddy < ar.r * ar.r) {
                spawnParticles(e3.x, e3.y, '#c43030', 8);
                wq.enemies.splice(j2, 1);
                wq.kills++;
                shake = 2;
                if (!ar.pierce) {
                  dead = true;
                  break;
                }
              }
            }
          }
          if (dead) wq.arrows.splice(a, 1);
        }
        // Death check: all 3 warriors down = game over
        var anyAlive =
          wq.healths[0] > 0 || wq.healths[1] > 0 || wq.healths[2] > 0;
        if (!anyAlive) {
          goGameOver();
          return;
        }
        // Check water pickup
        if (!wq.hasWater) {
          var dx2 = wq.waterX - wq.px,
            dy2 = wq.waterY - wq.py;
          if (Math.sqrt(dx2 * dx2 + dy2 * dy2) < 25) {
            wq.hasWater = true;
            wq.msg = 'Water obtained! Return to the cave!';
            wq.msgT = 3;
            popups.push({
              x: wq.px,
              y: wq.py - 20,
              text: 'WATER!',
              life: 1.5,
              color: '#5cb8e8',
            });
            spawnParticles(wq.waterX, wq.waterY, '#5cb8e8', 15);
          }
        }
        // Check cave return - win if at least 1 warrior reaches the cave with water
        if (wq.hasWater) {
          var dx3 = wq.caveX - wq.px,
            dy3 = wq.caveY - wq.py;
          if (Math.sqrt(dx3 * dx3 + dy3 * dy3) < 30) {
            state = 'water_cutscene';
            wq.cutsceneT = 0;
          }
        }
      }

      function renderWaterQuest() {
        // Battlefield - field with depth
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#6a8a4a');
        bg.addColorStop(0.3, '#5a7a3a');
        bg.addColorStop(1, '#4a6a2a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        // Grass texture
        for (var i = 0; i < 150; i++) {
          var gx = (i * 37) % W,
            gy = (i * 53) % H;
          ctx.fillStyle = 'rgba(50,70,20,0.35)';
          ctx.fillRect(gx, gy, 1, 3);
        }
        // Dirt path from cave to water
        ctx.fillStyle = 'rgba(130,100,60,0.2)';
        ctx.beginPath();
        ctx.moveTo(20, 320);
        ctx.quadraticCurveTo(W / 2, 340, 590, 320);
        ctx.lineTo(590, 340);
        ctx.quadraticCurveTo(W / 2, 360, 20, 340);
        ctx.closePath();
        ctx.fill();
        // Rocks
        for (var i = 0; i < 12; i++) {
          var rx = (i * 97) % W,
            ry = (i * 61) % H;
          ctx.fillStyle = '#7a7060';

          ctx.arc(rx, ry, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        // Winding path walls
        for (var wi = 0; wi < WQ_WALLS.length; wi++) {
          var wl = WQ_WALLS[wi];
          ctx.fillStyle = '#8a7860';
          ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          for (var lx = wl.x; lx < wl.x + wl.w; lx += 20)
            ctx.fillRect(lx, wl.y, 1, wl.h);
          for (var ly = wl.y; ly < wl.y + wl.h; ly += 20)
            ctx.fillRect(wl.x, ly, wl.w, 1);
          ctx.strokeStyle = '#6a5a44';
          ctx.lineWidth = 2;
          ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
        }
        // Cave on left
        ctx.fillStyle = '#2a1a10';
        ctx.beginPath();
        ctx.ellipse(20, 320, 25, 40, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a0a00';
        ctx.beginPath();
        ctx.ellipse(20, 320, 18, 30, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(240,216,120,0.4)';
        ctx.font = '10px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText('CAVE', 20, 370);
        // Water cup on right
        if (!wq.hasWater) {
          var bob = Math.sin(animTime * 3) * 3;
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = '#5cb8e8';
          ctx.beginPath();
          ctx.arc(wq.waterX, wq.waterY + bob, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#c0c0d0';
          ctx.beginPath();
          ctx.moveTo(wq.waterX - 10, wq.waterY - 5 + bob);
          ctx.lineTo(wq.waterX + 10, wq.waterY - 5 + bob);
          ctx.lineTo(wq.waterX + 7, wq.waterY + 10 + bob);
          ctx.lineTo(wq.waterX - 7, wq.waterY + 10 + bob);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#5cb8e8';
          ctx.fillRect(wq.waterX - 8, wq.waterY - 3 + bob, 16, 8);
          ctx.strokeStyle = '#a0a0b0';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = 'rgba(240,216,120,0.4)';
          ctx.font = '10px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText('WATER', wq.waterX, wq.waterY + 25 + bob);
        }
        // Enemies
        for (var i2 = 0; i2 < wq.enemies.length; i2++) {
          var e = wq.enemies[i2];
          ctx.fillStyle = '#7a5a3a';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#5a3a2a';
          ctx.beginPath();
          ctx.arc(e.x, e.y - 4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#3a2a1a';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(e.x + 4, e.y);
          ctx.lineTo(e.x + 12, e.y + 2);
          ctx.stroke();
        }
        // All 3 warriors move together; downed warriors lie on the ground.
        var offs = [
          [-6, 6],
          [6, 6],
          [0, -6],
        ];
        for (var c = 0; c < 3; c++) {
          var wx2 = wq.px + offs[c][0],
            wy2 = wq.py + offs[c][1];
          if (wq.healths[c] <= 0) {
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = '#9a8a7a';
            ctx.beginPath();
            ctx.ellipse(wx2, wy2, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.arc(wx2 + 8, wy2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else {
            drawWarrior(wx2, wy2, wq.dir, '#d4a574', '#3a2818');
          }
          var bw = 24,
            bh = 4;
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(wx2 - bw / 2, wy2 - 26, bw, bh);
          var hp = Math.max(0, wq.healths[c]) / 100;
          ctx.fillStyle =
            hp > 0.5 ? '#5cb85c' : hp > 0.25 ? '#e0a030' : '#c43030';
          ctx.fillRect(wx2 - bw / 2, wy2 - 26, bw * hp, bh);
          ctx.strokeStyle = 'rgba(240,216,120,0.5)';
          ctx.lineWidth = 1;
          ctx.strokeRect(wx2 - bw / 2, wy2 - 26, bw, bh);
        }
        // Attack animation: spear stab (K)
        if (wq.spearT > 0) {
          var sLen = wq.spearT > 0.15 ? 90 : 55;
          ctx.strokeStyle = '#6a4a2a';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(wq.px + wq.dir.x * 10, wq.py + wq.dir.y * 10);
          ctx.lineTo(wq.px + wq.dir.x * sLen, wq.py + wq.dir.y * sLen);
          ctx.stroke();
          ctx.strokeStyle = '#c0c0c0';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(wq.px + wq.dir.x * sLen, wq.py + wq.dir.y * sLen);
          ctx.lineTo(
            wq.px + wq.dir.x * (sLen + 8),
            wq.py + wq.dir.y * (sLen + 8),
          );
          ctx.stroke();
        } else if (wq.swordT > 0) {
          // Sword arc (J) - wide 90-degree swing with Goliath's Sword
          var prog = 1 - wq.swordT / 0.3;
          var base = Math.atan2(wq.dir.y, wq.dir.x);
          var sweepW = swordActive() ? Math.PI / 2 : Math.PI / 4;
          var halfW = sweepW / 2;
          var radW = swordActive() ? 58 : 45;
          ctx.strokeStyle =
            'rgba(240,216,120,' + (0.7 * (1 - prog)).toFixed(3) + ')';
          ctx.lineWidth = swordActive() ? 8 : 6;
          ctx.beginPath();
          ctx.arc(
            wq.px,
            wq.py,
            radW,
            base - halfW,
            base - halfW + sweepW * prog,
          );
          ctx.stroke();
          ctx.strokeStyle = '#c0c0d0';
          ctx.lineWidth = swordActive() ? 4 : 3;
          var bl = base - halfW + sweepW * prog;
          ctx.beginPath();
          ctx.moveTo(wq.px + Math.cos(bl) * 10, wq.py + Math.sin(bl) * 10);
          ctx.lineTo(
            wq.px + Math.cos(bl) * (radW + 7),
            wq.py + Math.sin(bl) * (radW + 7),
          );
          ctx.stroke();
        }
        // Arrows in flight (L)
        for (var a2 = 0; a2 < wq.arrows.length; a2++) {
          var ar2 = wq.arrows[a2];
          var an2 = Math.atan2(ar2.vy, ar2.vx);
          ctx.strokeStyle = '#8b6a3a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(ar2.x - Math.cos(an2) * 10, ar2.y - Math.sin(an2) * 10);
          ctx.lineTo(ar2.x, ar2.y);
          ctx.stroke();
          ctx.fillStyle = '#c0c0c0';
          ctx.beginPath();
          ctx.moveTo(ar2.x + Math.cos(an2) * 5, ar2.y + Math.sin(an2) * 5);
          ctx.lineTo(
            ar2.x + Math.cos(an2 + 2.5) * 4,
            ar2.y + Math.sin(an2 + 2.5) * 4,
          );
          ctx.lineTo(
            ar2.x + Math.cos(an2 - 2.5) * 4,
            ar2.y + Math.sin(an2 - 2.5) * 4,
          );
          ctx.closePath();
          ctx.fill();
        }
        // Water indicator if carrying
        if (wq.hasWater) {
          ctx.fillStyle = '#5cb8e8';
          ctx.beginPath();
          ctx.arc(wq.px + wq.dir.x * 5, wq.py - 15, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#3a98c8';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        // Attack key legend
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(5, H - 72, 190, 66);
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 12px Georgia';
        ctx.textAlign = 'left';
        ctx.fillText('J: Sword (Eleazar)', 10, H - 54);
        ctx.fillText('K: Spear (Josheb)', 10, H - 38);
        ctx.fillText('L: Arrow (Shammah)', 10, H - 22);
        ctx.fillStyle = 'rgba(245,230,200,0.6)';
        ctx.font = '10px Georgia';
        ctx.fillText(
          wq.hasWater ? 'Return to the cave!' : 'Reach the water!',
          10,
          H - 8,
        );
        // Message
        if (wq.msg && wq.msgT > 0) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, H / 2 - 25, W, 50);
          ctx.fillStyle = '#5cb8e8';
          ctx.font = 'bold 18px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(wq.msg, W / 2, H / 2 + 6);
        }
      }

      // === WATER CUTSCENE ===
      function updateWaterCutscene(dt) {
        wq.cutsceneT += dt;
      }
      function renderWaterCutscene() {

        var bg = ctx.createRadialGradient(

          H / 2,

        );

          // David
          drawWarrior(420, 400, { x: -1, y: 0 }, '#d4a574', '#2a1808');

          ctx.fillText('- 2 Samuel 23:17', W / 2, H * 0.3 + 28);
          ctx.fillStyle = '#5cb85c';
          ctx.font = 'bold 20px Georgia';
          ctx.fillText('David is now unlocked!', W / 2, H * 0.5);
          if (Math.sin(animTime * 3) > -0.3) {
            ctx.fillStyle = '#f0d878';
            ctx.font = 'bold 18px Georgia';
            ctx.fillText('PRESS SPACE TO CONTINUE', W / 2, H * 0.85);
          }
        }
      }

      function unlockDavidAndReturn() {
        unlockDavid();
        // Water Quest stays unlocked so it can be replayed
        state = 'charselect';
      }

      function checkDavidUnlock() {
        if (completed.josheb && completed.eleazar && completed.shammah) {
          if (!waterQuestUnlocked) {
            waterQuestUnlocked = true;
            saveProgress();
          }
        }
      }
      function unlockDavid() {
        davidUnlocked = true;
        saveProgress();
        charData[3].name = 'David';
        charData[3].desc = 'Face Goliath';
        charData[3].color = '#c0a050';
        charData[3].sub =
          '"You come with a sword, but I come in the name of Yehovah"';
        charData[3].locked = false;
      }

      // === RENDER ===
      function render() {
        if (state === 'menu') {
          renderMenu();
          return;
        }
        if (state === 'charselect') {
          renderCharSelect();
          return;
        }
        if (state === 'levelcomplete') {
          renderLevelComplete();
          return;
        }
        if (state === 'gameover') {
          renderGameOver();
          return;
        }
        if (state === 'davidvictory') {
          renderDavidVictory();
          return;
        }
        if (state === 'water_quest') {
          renderWaterQuest();
          return;
        }
        if (state === 'water_cutscene') {
          renderWaterCutscene();
          return;
        }
        if (state === 'paused') {
          renderPaused();
          return;
        }

        var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
        var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
        ctx.save();
        ctx.translate(sx, sy);

        if (state === 'david_fight') {
          renderDavid();
        } else if (state === 'playing') {
          if (selectedChar === 'josheb') renderJosheb();
          else if (selectedChar === 'eleazar') renderEleazar();
          else if (selectedChar === 'shammah') renderShammah();
        }

        drawParticles();
        drawPopups();
        ctx.restore();

        if (
          state === 'david_fight' &&
          dv.phase !== 'aim' &&
          dv.phase !== 'flying'
        ) {
          // Overlay for hit/miss
        }
      }

          }
          ctx.lineTo(W, H);
          ctx.lineTo(0, H);

          // Tent
          ctx.fillStyle = '#5a4a3a';
