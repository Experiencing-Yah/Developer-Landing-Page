      // === CHARACTER SELECT ===
      // Big pixel-art face portrait used on the character select cards
      function drawFacePortrait(cx, cy, size, charId, locked) {
        var u = size / 16;
        var x0 = cx - size / 2,
          y0 = cy - size / 2;
        function px(gx, gy, gw, gh, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x0 + gx * u, y0 + gy * u, gw * u, gh * u);
        }
        var skin = '#d4a574',
          hairC = '#3a2818',
          darkC = '#241a10',
          beardC = '#332415';
        if (locked) {
          // Dark silhouette with "?" overlay
          ctx.fillStyle = 'rgba(25,22,32,0.95)';
          ctx.beginPath();
          ctx.ellipse(cx, cy + u * 0.5, 5.5 * u, 6 * u, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(cx - 6 * u, cy + 5.5 * u, 12 * u, 3.5 * u);
          ctx.fillStyle = '#9a9a9a';
          ctx.font = 'bold ' + Math.floor(size * 0.5) + 'px Georgia';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('?', cx, cy + u * 0.5);
          ctx.textBaseline = 'alphabetic';
          return;
        }
        var isDavid = charId === 'david';
        // Long hair mass behind the head (David)
        if (isDavid) px(3, 2, 10, 13, hairC);
        // Head: pixel-art ellipse built from stacked rows
        var rows = [
          [5, 2, 6],
          [4, 3, 8],
          [4, 4, 8],
          [4, 5, 8],
          [4, 6, 8],
          [4, 7, 8],
          [4, 8, 8],
          [4, 9, 8],
          [5, 10, 6],
          [6, 11, 4],
        ];
        for (var r = 0; r < rows.length; r++)
          px(rows[r][0], rows[r][1], rows[r][2], 1, skin);
        // Hair
        var hairRows;
        if (isDavid) {
          // Youthful, longer hair
          hairRows = [
            [4, 1, 8],
            [3, 2, 10],
            [3, 3, 2],
            [11, 3, 2],
            [3, 4, 2],
            [11, 4, 2],
            [3, 5, 2],
            [11, 5, 2],
            [3, 6, 2],
            [11, 6, 2],
            [3, 7, 1],
            [12, 7, 1],
          ];
        } else if (charId === 'eleazar') {
          // Medium hair
          hairRows = [
            [4, 1, 8],
            [3, 2, 10],
            [3, 3, 2],
            [11, 3, 2],
            [3, 4, 2],
            [11, 4, 2],
            [3, 5, 1],
            [12, 5, 1],
          ];
        } else {
          // Short hair (Josheb, Shammah)
          hairRows = [
            [4, 1, 8],
            [3, 2, 10],
            [3, 3, 2],
            [11, 3, 2],
            [3, 4, 1],
            [12, 4, 1],
          ];
        }
        for (var r2 = 0; r2 < hairRows.length; r2++)
          px(hairRows[r2][0], hairRows[r2][1], hairRows[r2][2], 1, hairC);
        // Eyebrows, eyes, mouth and beard per character
        if (charId === 'josheb') {
          // Stern expression: angled brows, full beard
          px(5, 5, 1, 1, darkC);
          px(6, 6, 1, 1, darkC);
          px(10, 5, 1, 1, darkC);
          px(9, 6, 1, 1, darkC);
          px(6, 7, 1, 1, darkC);
          px(9, 7, 1, 1, darkC);
          px(5, 10, 6, 1, beardC);
          px(4, 11, 8, 2, beardC);
          px(5, 13, 6, 1, beardC);
        } else if (charId === 'eleazar') {
          // Determined expression: straight brows, firm mouth, medium beard
          px(5, 6, 2, 1, darkC);
          px(9, 6, 2, 1, darkC);
          px(6, 7, 1, 1, darkC);
          px(9, 7, 1, 1, darkC);
          px(6, 10, 4, 1, beardC);
          px(5, 11, 6, 2, beardC);
        } else if (charId === 'shammah') {
          // Calm expression: soft eyes, gentle mouth, short beard
          px(5, 6, 2, 1, darkC);
          px(9, 6, 2, 1, darkC);
          px(6, 7, 1, 1, darkC);
          px(9, 7, 1, 1, darkC);
          px(7, 10, 2, 1, beardC);
          px(5, 11, 6, 2, beardC);
          px(6, 13, 4, 1, beardC);
        } else {
          // David: youthful face, no beard
          px(5, 6, 2, 1, darkC);
          px(9, 6, 2, 1, darkC);
          px(6, 7, 1, 1, '#1a1008');
          px(9, 7, 1, 1, '#1a1008');
          px(6, 8, 1, 1, skin);
          px(9, 8, 1, 1, skin);
          px(7, 10, 2, 1, beardC);
          if (davidUnlocked) {
            // Sling visible over the shoulder
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = Math.max(1.5, u * 0.5);
            ctx.beginPath();
            ctx.moveTo(x0 + 13 * u, y0 + 9 * u);
            ctx.quadraticCurveTo(
              x0 + 15.5 * u,
              y0 + 11.5 * u,
              x0 + 13.5 * u,
              y0 + 14.5 * u,
            );
            ctx.stroke();
            ctx.fillStyle = '#6a4a2a';
            ctx.beginPath();
            ctx.arc(x0 + 13.5 * u, y0 + 14.5 * u, u * 1.1, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // === CHARACTER SELECT ===
      function renderCharSelect() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#2a2540');
        bg.addColorStop(1, '#1a1525');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 28px Georgia';
        ctx.fillText('CHOOSE YOUR WARRIOR', W / 2, 45);

        // Top row: Josheb, Eleazar, Shammah
        var cardW = 150,
          cardH = 170,
          gap = 18;
        var topTotal = 3 * cardW + 2 * gap;
        var topStartX = (W - topTotal) / 2;
        var topY = 62;
        var topPositions = [
          { x: topStartX, y: topY },
          { x: topStartX + cardW + gap, y: topY },
          { x: topStartX + 2 * (cardW + gap), y: topY },
        ];
        for (var i = 0; i < 3; i++) {
          drawCharCard(i, topPositions[i], cardW, cardH);
        }

        // Water Quest: a long horizontal bar spanning the width of the 3 top
        // cards, with an extra gap below the top row. No portrait - just text.
        var wqY = topY + cardH + 50;
        var wqH = 52;
        {
          var selWQ = charSelIdx === 3;
          ctx.fillStyle = selWQ ? 'rgba(240,216,120,0.15)' : 'rgba(0,0,0,0.3)';
          ctx.fillRect(topStartX, wqY, topTotal, wqH);
          ctx.strokeStyle = selWQ ? '#f0d878' : 'rgba(100,100,100,0.4)';
          ctx.lineWidth = selWQ ? 3 : 1;
          ctx.strokeRect(topStartX, wqY, topTotal, wqH);
          if (waterQuestUnlocked) {
            ctx.fillStyle = selWQ ? '#f0d878' : '#5cb8e8';
            ctx.font = 'bold 16px Georgia';
            ctx.fillText('Water Quest', W / 2, wqY + 22);
            ctx.fillStyle = 'rgba(245,230,200,0.7)';
            ctx.font = 'italic 11px Georgia';
            ctx.fillText('"I thirst" \u00b7 2 Samuel 23:15', W / 2, wqY + 41);
          } else {
            ctx.fillStyle = 'rgba(100,100,100,0.6)';
            ctx.font = 'bold 16px Georgia';
            ctx.fillText('???', W / 2, wqY + 22);
            ctx.fillStyle = 'rgba(100,100,100,0.4)';
            ctx.font = 'italic 11px Georgia';
            ctx.fillText('Complete all 3 warriors to unlock', W / 2, wqY + 41);
          }
        }

        // David card centered below the Water Quest bar with a gap
        var davidY = wqY + wqH + 40;
        drawCharCard(3, { x: (W - cardW) / 2, y: davidY }, cardW, cardH, 4);

        // Goliath's Sword toggle (nav item 5) — only visible when unlocked, more spacing
        if (goliathSwordUnlocked) {
          var cbW = 280,
            cbH = 28;
          var cbX = (W - cbW) / 2,
            cbY = davidY + cardH + 30;
          var selSword = charSelIdx === 5;
          ctx.fillStyle = selSword
            ? 'rgba(240,216,120,0.15)'
            : 'rgba(0,0,0,0.3)';
          ctx.fillRect(cbX, cbY, cbW, cbH);
          ctx.strokeStyle = selSword ? '#f0d878' : 'rgba(100,100,100,0.5)';
          ctx.lineWidth = selSword ? 3 : 1;
          ctx.strokeRect(cbX, cbY, cbW, cbH);
          // Checkbox
          ctx.strokeRect(cbX + 8, cbY + 7, 14, 14);
          if (swordEnabled) {
            ctx.fillStyle = '#f0d878';
            ctx.fillRect(cbX + 11, cbY + 10, 8, 8);
          }
          ctx.fillStyle = swordEnabled ? '#f0d878' : 'rgba(245,230,200,0.6)';
          ctx.font = 'bold 13px Georgia';
          ctx.textAlign = 'left';
          ctx.fillText('Goliath\u2019s Sword', cbX + 30, cbY + 19);
          ctx.textAlign = 'center';
        } else {
          // Show ??? for locked sword
          var cbW2 = 280,
            cbH2 = 28;
          var cbX2 = (W - cbW2) / 2,
            cbY2 = davidY + cardH + 30;
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(cbX2, cbY2, cbW2, cbH2);
          ctx.strokeStyle = 'rgba(100,100,100,0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(cbX2, cbY2, cbW2, cbH2);
          ctx.fillStyle = 'rgba(100,100,100,0.4)';
          ctx.font = 'bold 13px Georgia';
          ctx.fillText('???', W / 2, cbY2 + 19);
        }

        // Instructions (progress info now lives in the HUD bar above)
        ctx.fillStyle = 'rgba(245,230,200,0.7)';
        ctx.font = '13px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText(
          'Arrows/WASD to select \u00b7 Space to choose',
          W / 2,
          H - 14,
        );
      }

      function drawCharCard(idx, pos, cardW, cardH, selIdx) {
        var c = charData[idx];
        var selected = (selIdx !== undefined ? selIdx : idx) === charSelIdx;
        var isDone = c.id && completed[c.id];
        var locked = c.locked && !davidUnlocked;
        var hiddenWQ = c.waterQuest && !waterQuestUnlocked;
        var grow = selected ? 4 : 0;
        var cx = pos.x - grow,
          cy = pos.y - grow,
          cw = cardW + grow * 2,
          ch = cardH + grow * 2;

        if (hiddenWQ) {
          // Don't show water quest if not unlocked
          return;
        }

        // Card background
        ctx.fillStyle = selected ? 'rgba(240,216,120,0.15)' : 'rgba(0,0,0,0.3)';
        ctx.fillRect(cx, cy, cw, ch);
        ctx.strokeStyle = selected ? '#f0d878' : 'rgba(100,100,100,0.4)';
        ctx.lineWidth = selected ? 3 : 1;
        ctx.strokeRect(cx, cy, cw, ch);

        // Portrait
        var pcx = pos.x + cardW / 2,
          pcy = pos.y + 58;
        if (c.waterQuest) {
          // Draw all 3 warriors together
          drawWarrior(pcx - 16, pcy + 10, { x: 0, y: 1 }, '#d4a574', '#3a2818');
          drawWarrior(pcx, pcy + 10, { x: 0, y: 1 }, '#d4a574', '#3a2818');
          drawWarrior(pcx + 16, pcy + 10, { x: 0, y: 1 }, '#d4a574', '#3a2818');
          // Water cup
          ctx.fillStyle = '#5cb8e8';
          ctx.beginPath();
          ctx.arc(pcx, pcy - 20, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          drawFacePortrait(pcx, pcy, 82 + grow * 4, c.id, locked);
        }

        // Name
        ctx.fillStyle = locked ? '#666' : selected ? '#f0d878' : '#c0a878';
        ctx.font = 'bold 13px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, pos.x + cardW / 2, pos.y + 120);

        // Description
        ctx.fillStyle = locked ? '#555' : 'rgba(245,230,200,0.7)';
        ctx.font = '11px Georgia';
        ctx.fillText(c.desc, pos.x + cardW / 2, pos.y + 137);

        // Quote
        ctx.fillStyle = locked ? '#444' : 'rgba(245,230,200,0.5)';
        ctx.font = 'italic 9px Georgia';
        wrapText(c.sub, pos.x + cardW / 2, pos.y + 152, cardW - 12, 11);

        // Checkmark
        if (isDone || (c.id === 'david' && davidVictory)) {
          ctx.fillStyle = '#5cb85c';
          ctx.font = 'bold 16px Georgia';
          ctx.fillText('\u2713', pos.x + cardW - 14, pos.y + 16);
        }
      }

      function wrapText(text, x, y, maxW, lineH) {
        var words = text.split(' ');
        var line = '';
        var ly = y;
        for (var i = 0; i < words.length; i++) {
          var test = line + words[i] + ' ';
          if (ctx.measureText(test).width > maxW && line) {
            ctx.fillText(line, x, ly);
            ly += lineH;
            line = words[i] + ' ';
          } else {
            line = test;
          }
        }
        if (line) ctx.fillText(line, x, ly);
      }

      // === LEVEL COMPLETE ===
      function renderLevelComplete() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#2a3a2a');
        bg.addColorStop(1, '#1a2a1a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Victory rays
        for (var i = 0; i < 12; i++) {
          var a = animTime * 0.5 + (i * Math.PI) / 6;
          ctx.strokeStyle = 'rgba(240,216,120,0.08)';
          ctx.lineWidth = 30;
          ctx.beginPath();
          ctx.moveTo(W / 2, H / 2);
          ctx.lineTo(W / 2 + Math.cos(a) * 400, H / 2 + Math.sin(a) * 400);
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        var name =
          selectedChar === 'josheb'
            ? 'Josheb-Basshebeth'
            : selectedChar === 'eleazar'
              ? 'Eleazar'
              : 'Shammah';
        ctx.fillStyle = '#f0d878';
        ctx.shadowColor = 'rgba(240,216,120,0.5)';
        ctx.shadowBlur = 20;
        ctx.font = 'bold 32px Georgia';
        ctx.fillText('VICTORY!', W / 2, H * 0.3);
        ctx.font = 'bold 20px Georgia';
        ctx.fillText(name + ' stands triumphant', W / 2, H * 0.3 + 40);
        ctx.shadowBlur = 0;

        // Stats
        ctx.fillStyle = 'rgba(245,230,200,0.8)';
        ctx.font = '14px Georgia';
        if (selectedChar === 'josheb')
          ctx.fillText('800 men defeated', W / 2, H * 0.45);
        else if (selectedChar === 'eleazar')
          ctx.fillText(
            el_state.enemiesKilled + ' enemies slain across 9 waves',
            W / 2,
            H * 0.45,
          );
        else if (selectedChar === 'shammah')
          ctx.fillText(
            'Plot defended! ' + sh.kills + ' enemies stopped',
            W / 2,
            H * 0.45,
          );

        // Progress
        var done = 0;
        if (completed.josheb) done++;
        if (completed.eleazar) done++;
        if (completed.shammah) done++;
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 14px Georgia';
        ctx.fillText('Warriors completed: ' + done + '/3', W / 2, H * 0.55);

        if (!davidUnlocked && !waterQuestUnlocked) {
          ctx.fillStyle = 'rgba(245,230,200,0.6)';
          ctx.font = '12px Georgia';
          ctx.fillText(
            'Win with all three to unlock the Water Quest',
            W / 2,
            H * 0.62,
          );
        } else if (waterQuestUnlocked && !davidUnlocked) {
          ctx.fillStyle = '#5cb8e8';
          ctx.font = 'bold 14px Georgia';
          ctx.fillText(
            'All three complete! Press SPACE for the Water Quest!',
            W / 2,
            H * 0.62,
          );
        } else {
          ctx.fillStyle = '#f0d878';
          ctx.font = 'bold 14px Georgia';
          ctx.fillText(
            'David unlocked! Choose him to face Goliath!',
            W / 2,
            H * 0.62,
          );
        }

        if (Math.sin(animTime * 3) > -0.3) {
          ctx.fillStyle = '#f0d878';
          ctx.shadowColor = 'rgba(240,216,120,0.5)';
          ctx.shadowBlur = 15;
          ctx.font = 'bold 18px Georgia';
          ctx.fillText('PRESS SPACE TO CONTINUE', W / 2, H * 0.82);
          ctx.shadowBlur = 0;
        }
      }

      // === GAME OVER ===
      function renderGameOver() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#3a1010');
        bg.addColorStop(1, '#1a0808');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#c43030';
        ctx.shadowColor = 'rgba(196,48,48,0.5)';
        ctx.shadowBlur = 20;
        ctx.font = 'bold 36px Georgia';
        ctx.fillText('DEFEATED', W / 2, H * 0.3);
        ctx.shadowBlur = 0;

        var name =
          selectedChar === 'josheb'
            ? 'Josheb-Basshebeth'
            : selectedChar === 'eleazar'
              ? 'Eleazar'
              : selectedChar === 'shammah'
                ? 'Shammah'
                : 'David';
        ctx.fillStyle = 'rgba(245,230,200,0.7)';
        ctx.font = '16px Georgia';
        if (selectedChar === 'josheb')
          ctx.fillText(
            name + ' fell with ' + (jb.total - jb.kills) + ' men remaining',
            W / 2,
            H * 0.42,
          );
        else if (selectedChar === 'eleazar')
          ctx.fillText(
            'Eleazar fell in battle (' + el_state.enemiesKilled + ' slain)',
            W / 2,
            H * 0.42,
          );
        else if (selectedChar === 'shammah')
          ctx.fillText(
            'The plot was overrun (' + sh.breaches + ' breaches)',
            W / 2,
            H * 0.42,
          );
        else if (selectedChar === 'water')
          ctx.fillText(
            'You failed to bring water to your future king',
            W / 2,
            H * 0.42,
          );
        else if (selectedChar === 'david')
          ctx.fillText('You ran out of stones!', W / 2, H * 0.42);

        if (Math.sin(animTime * 3) > -0.3) {
          ctx.fillStyle = '#f0d878';
          ctx.font = 'bold 18px Georgia';
          ctx.fillText('Press SPACE for Character Select', W / 2, H * 0.82);
        }
      }

      // === DAVID VICTORY ===
      function renderDavidVictory() {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#4a5a2a');
        bg.addColorStop(0.5, '#6a8a3a');
        bg.addColorStop(1, '#4a5a2a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        // Rays
        for (var i = 0; i < 16; i++) {
          var a = animTime * 1 + (i * Math.PI) / 8;
          ctx.strokeStyle = 'rgba(240,216,120,0.1)';
          ctx.lineWidth = 25;
          ctx.beginPath();
          ctx.moveTo(W / 2, H * 0.4);
          ctx.lineTo(W / 2 + Math.cos(a) * 500, H * 0.4 + Math.sin(a) * 500);
          ctx.stroke();
        }
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f0d878';
        ctx.shadowColor = 'rgba(240,216,120,0.7)';
        ctx.shadowBlur = 30;
        ctx.font = 'bold 40px Georgia';
        ctx.fillText('VICTORY!', W / 2, H * 0.25);
        ctx.font = 'bold 22px Georgia';
        ctx.fillText('Goliath has fallen!', W / 2, H * 0.25 + 44);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(245,230,200,0.8)';
        ctx.font = 'italic 14px Georgia';
        ctx.fillText(
          '"This day Yehovah has delivered you into my hand"',
          W / 2,
          H * 0.4,
        );
        ctx.fillText('- 1 Samuel 17:46', W / 2, H * 0.4 + 22);
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 14px Georgia';
        ctx.fillText(
          'All of David\u2019s mighty men have proven themselves!',
          W / 2,
          H * 0.55,
        );
        if (Math.sin(animTime * 3) > -0.3) {
          ctx.fillStyle = '#f0d878';
          ctx.font = 'bold 18px Georgia';
          ctx.fillText('PRESS SPACE TO RETURN', W / 2, H * 0.87);
        }
      }

      // === UPDATE LOOP ===
      function update(dt) {
        animTime += dt;
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 250 * dt;
          p.life -= dt * 2;
        }
        particles = particles.filter(function (p) {
          return p.life > 0;
        });
        for (var i = 0; i < popups.length; i++) popups[i].life -= dt * 1.5;
        popups = popups.filter(function (p) {
          return p.life > 0;
        });
        if (shake > 0) shake -= dt * 30;

        if (state === 'paused') return;
        if (state === 'playing') {
          if (selectedChar === 'josheb') updateJosheb(dt);
          else if (selectedChar === 'eleazar') updateEleazar(dt);
          else if (selectedChar === 'shammah') updateShammah(dt);
        } else if (state === 'david_fight') {
          updateDavid(dt);
        } else if (state === 'water_quest') {
          updateWaterQuest(dt);
        } else if (state === 'water_cutscene') {
          updateWaterCutscene(dt);
        }
        updateHUD();
      }

      function loop(ts) {
        if (!lastTime) lastTime = ts;
        var dt = Math.min((ts - lastTime) / 1000, 0.05);
        lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      // === LOCALSTORAGE PERSISTENCE ===
      var SAVE_KEY = 'davids_defenders_save';
      // DEBUG: set to true to fake full completion for testing all modes
      var DEBUG_UNLOCK_ALL = false;
      function saveProgress() {
        try {
          localStorage.setItem(
            SAVE_KEY,
            JSON.stringify({
              completed: {
                josheb: !!completed.josheb,
                eleazar: !!completed.eleazar,
                shammah: !!completed.shammah,
              },
              waterQuestUnlocked: !!waterQuestUnlocked,
              davidUnlocked: !!davidUnlocked,
              davidVictory: !!davidVictory,
              goliathSwordUnlocked: !!goliathSwordUnlocked,
              swordEnabled: !!swordEnabled,
            }),
          );
        } catch (err) {}
      }
      function loadProgress() {
        if (DEBUG_UNLOCK_ALL) {
          completed.josheb = true;
          completed.eleazar = true;
          completed.shammah = true;
          waterQuestUnlocked = true;
          unlockDavid();
          davidVictory = true;
          goliathSwordUnlocked = true;
          swordEnabled = true;
          return;
        }
        try {
          var raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return;
          var s = JSON.parse(raw);
          if (s.completed) {
            completed.josheb = !!s.completed.josheb;
            completed.eleazar = !!s.completed.eleazar;
            completed.shammah = !!s.completed.shammah;
          }
          if (s.waterQuestUnlocked) waterQuestUnlocked = true;
          if (s.davidUnlocked) unlockDavid();
          if (s.davidVictory) davidVictory = true;
          if (s.goliathSwordUnlocked) goliathSwordUnlocked = true;
          if (typeof s.swordEnabled === 'boolean')
            swordEnabled = s.swordEnabled;
          else if (goliathSwordUnlocked) swordEnabled = true;
        } catch (err) {}
      }
      loadProgress();

      requestAnimationFrame(loop);
      var music = GameMusic.create({
        basePath: '../../audio/davids-defenders',
        fallbackBasePath: '.',
        toggleSelector: '#music-toggle',
      });
      music.start();
    </script>
      <script src="../embed.js"></script>
  </body>
