<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temple Throwdown — overturn the tables and cleanse the temple courts. A Scripture-inspired browser game from Experiencing Yah."
    />
    <title>Temple Throwdown | Experiencing Yah</title>
    <link rel="icon" type="image/svg+xml" href="../../FlameMaterial.svg" />
    <link rel="alternate icon" href="../../FlameMaterial.svg" />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        --gold: #f0d878;
        --parchment: #f5e6c8;
        --night: #1a1525;
        --stone: #8a7860;
      }
      #game-container {
        position: relative;
        width: 660px;
        max-width: 100%;
        font-family: Georgia, 'Palatino Linotype', serif;
        color: var(--parchment);
      }
      #hud {
        background: linear-gradient(180deg, #2d2640, #221d33);
        border: 2px solid var(--gold);
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 14px;
      }
      .hud-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .hud-label {
        color: var(--gold);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .hud-value {
        font-size: 18px;
        font-weight: bold;
        color: var(--parchment);
      }
      #progress-bar-bg {
        width: 100px;
        height: 8px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--gold);
        border-radius: 4px;
        overflow: hidden;
      }
      #progress-bar-fill {
        height: 100%;
        background: var(--gold);
        transition: width 0.3s;
      }
      #canvas-wrap {
        position: relative;
        border: 2px solid var(--gold);
        border-top: none;
        border-radius: 0 0 10px 10px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: rgba(20, 15, 30, 0.94);
        padding: 30px;
        z-index: 10;
      }
      #overlay.hidden {
        display: none;
      }
      .overlay-title {
        font-size: 30px;
        color: var(--gold);
        margin-bottom: 14px;
        text-shadow: 0 0 20px rgba(240, 216, 120, 0.3);
      }
      .overlay-message {
        font-size: 19px;
        color: var(--parchment);
        margin-bottom: 14px;
        max-width: 500px;
        line-height: 1.5;
      }
      .overlay-sub {
        font-size: 14px;
        color: #aaa;
        margin-top: 4px;
        margin-bottom: 10px;
        max-width: 480px;
        line-height: 1.4;
      }
      .overlay-stat {
        font-size: 15px;
        color: var(--gold);
        margin-bottom: 18px;
      }
      .btn-prompt {
        font-size: 15px;
        color: var(--parchment);
        border: 2px solid var(--gold);
        padding: 8px 22px;
        border-radius: 6px;
        animation: blink 1.5s infinite;
        cursor: pointer;
        user-select: none;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .touch-controls--temple {
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        gap: 0.75rem;
      }
      .touch-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.45rem;
      }
      @media (max-width: 820px), (pointer: coarse) {
        .touch-controls--temple {
          display: flex;
        }
      }
    </style>
  </head>

    <main class="game-main">
      <div id="game-container">
        <div id="hud">
          <div class="hud-section">

          </div>
          <div class="hud-section">
            <div class="hud-label">Cleansed</div>

          </div>
          <div class="hud-section">
            <div class="hud-label">
              <div id="progress-bar-bg">
                <div id="progress-bar-fill" style="width: 0%"></div>

            </div>
          </div>
          <div class="hud-section">

          <button

                d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"

            <svg

              type="button"

    <script>
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var W = canvas.width,
        H = canvas.height;
      function el(id) {
        return document.getElementById(id);
      }
      var overlay = el('overlay'),
        overlayTitle = el('overlay-title'),
        overlayMessage = el('overlay-message'),
        overlaySub = el('overlay-sub'),
        overlayStat = el('overlay-stat'),
        btnPrompt = el('btn-prompt'),
        levelDisplay = el('level-display'),
        cleansedDisplay = el('cleansed-display'),
        timeDisplay = el('time-display'),
        progressBarFill = el('progress-bar-fill'),
        bestDisplay = el('best-display');

      var BEST_KEY = 'temple-throwdown';
      var bestLevel = GameHighScore.get(BEST_KEY);

      var CELL = 40,
        COLS = 16,
        ROWS = 16;
      var FX = (W - COLS * CELL) / 2,
        FY = (H - ROWS * CELL) / 2,
        FW = COLS * CELL,
        FH = ROWS * CELL;
      function setupGrid(cols, rows) {
        COLS = cols;
        ROWS = rows;
        FX = (W - COLS * CELL) / 2;
        FY = (H - ROWS * CELL) / 2;
        FW = COLS * CELL;
        FH = ROWS * CELL;
      }
      var state = 'menu',
        level = 1,
        gameTime = 0,
        levelTime = 60;
      var player = {
        x: 0,
        y: 0,
        gx: 0,
        gy: 0,
        tx: 0,
        ty: 0,
        tween: -1,
        moveCD: 0,
        dir: { x: 0, y: 1 },
        whipT: 0,
        flipT: 0,
        walkAnim: 0,
      };
      var objects = [],
        particles = [],
        popups = [],
        escapedAnimals = [],
        escapedBirds = [];
      var lastTime = 0,
        animTime = 0,
        spacePressed = false;
      var totalObjects = 0,
        cleansedCount = 0;
      var whipCone = [],
        whipTimer = 0;
      var shake = 0;

      var keys = {};
      window.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        if (
          [
            'arrowup',
            'arrowdown',
            'arrowleft',
            'arrowright',
            ' ',
            'j',
            'k',
            'w',
            'a',
            's',
            'd',
          ].indexOf(k) >= 0
        )
          e.preventDefault();
        if (!keys[k]) {
          keys[k] = true;
          if (k === ' ' && !spacePressed) {
            spacePressed = true;
            handleSpace();
          }
          if (state === 'playing') {
            if (k === 'j' || k === 'enter') {
              doWhip();
            }
            if (k === 'k' || k === 'shift') {
              doFlip();
            }
            if (k === 'p') {
              state = 'paused';
              showOverlay(
                'Paused',
                'Press P to resume',
                '',
                '',
                'Press P to resume',
                false,
              );
            }
          } else if (state === 'paused' && k === 'p') {
            state = 'playing';
            hideOverlay();
          }
        }
      });
      window.addEventListener('keyup', function (e) {
        keys[e.key.toLowerCase()] = false;
        if (e.key.toLowerCase() === ' ') spacePressed = false;
      });
      btnPrompt.addEventListener('click', function () {
        if (!spacePressed) {
          spacePressed = true;
          handleSpace();
          setTimeout(function () {
            spacePressed = false;
          }, 250);
        }
      });

      (function setupTouchControls() {
        var root = document.querySelector('.touch-controls');
        if (!root) return;
        function holdKey(key, down) {
          keys[key] = !!down;
        }
        function bindHold(btn, key) {
          function start(e) {
            e.preventDefault();
            btn.classList.add('is-active');
            holdKey(key, true);
          }
          function end(e) {
            e.preventDefault();
            btn.classList.remove('is-active');
            holdKey(key, false);
          }
          btn.addEventListener('touchstart', start, { passive: false });
          btn.addEventListener('touchend', end, { passive: false });
          btn.addEventListener('touchcancel', end, { passive: false });
          btn.addEventListener('mousedown', start);
          btn.addEventListener('mouseup', end);
          btn.addEventListener('mouseleave', end);
        }
        root.querySelectorAll('.touch-btn[data-key]').forEach(function (btn) {
          bindHold(btn, btn.getAttribute('data-key'));
        });
        function bindTap(btn, fn) {
          if (!btn) return;
          function fire(e) {
            e.preventDefault();
            btn.classList.add('is-active');
            fn();
            setTimeout(function () {
              btn.classList.remove('is-active');
            }, 120);
          }
          btn.addEventListener('touchstart', fire, { passive: false });
          btn.addEventListener('click', fire);
        }
        bindTap(document.getElementById('touch-whip'), function () {
          if (state === 'playing') doWhip();
        });
        bindTap(document.getElementById('touch-flip'), function () {
          if (state === 'playing') doFlip();
        });
        bindTap(document.getElementById('touch-action'), function () {
          if (
            state === 'menu' ||
            state === 'gameOver' ||
            state === 'levelComplete'
          ) {
            if (!spacePressed) {
              spacePressed = true;
              handleSpace();
              setTimeout(function () {
                spacePressed = false;
              }, 250);
            }
          } else if (state === 'paused') {
            state = 'playing';
            hideOverlay();
          } else if (state === 'playing') {
            state = 'paused';
            showOverlay(
              'Paused',
              'Tap Go or press P to resume',
              '',
              '',
              'Tap Go to resume',
              false,
            );
          }
        });
      })();

      function handleSpace() {
        if (state === 'menu') startGame();
        else if (state === 'levelComplete') {
          level++;
          startLevel();
          hideOverlay();
        } else if (state === 'gameOver') startGame();
      }

      function startGame() {
        level = 1;
        startLevel();
      }

      function startLevel() {
        objects = [];
        particles = [];
        popups = [];
        whipCone = [];
        shake = 0;
        escapedAnimals = [];
        escapedBirds = [];
        // Grid starts at 10 and grows by 2 every 5 levels (cells shrink to fit)
        var gs = Math.min(10 + Math.floor((level - 1) / 5) * 2, 20);
        CELL = Math.max(24, Math.floor(W / gs));
        setupGrid(gs, gs);
        levelTime = 30;
        gameTime = levelTime;
        cleansedCount = 0;
        player.gx = COLS - 1;
        player.gy = ROWS - 1;
        player.x = player.gx;
        player.y = player.gy;
        player.tx = player.gx;
        player.ty = player.gy;
        player.tween = -1;
        player.dir = { x: -1, y: 0 };
        player.whipT = 0;
        player.flipT = 0;
        player.walkAnim = 0;
        player.moveCD = 0;
        // Level 1: 2 tables + 2 cages; each later level adds one more item
        var numTables = 2,
          numCages = 2,
          numPens = 0;
        for (var i = 0; i < level - 1; i++) {
          var kind = i % 3;
          if (kind === 0) numTables++;
          else if (kind === 1) numCages++;
          else numPens++;
        }
        // Pens need room — on tiny grids fold them into tables
        if (gs < 12 && numPens > 0) {
          numTables += numPens;
          numPens = 0;
        }
        placeObjects('table', numTables);
        placeObjects('cage', numCages);
        if (numPens > 0) placeObjects('pen', numPens);
        // Walls from level 3 onward; scale with level/grid, leave paths open
        var numWalls = Math.max(0, level - 2);
        var wallCap = Math.max(4, Math.floor(gs * 0.75));
        if (numWalls > wallCap) numWalls = wallCap;
        placeWalls(numWalls);
        totalObjects = objects.length;
        state = 'playing';
        hideOverlay();
        updateHUD();
      }

      function placeObjects(type, count) {
        for (var i = 0; i < count; i++) {
          var attempts = 0,
            placed = false;
          while (!placed && attempts < 100) {
            attempts++;
            if (type === 'pen') {
              var x = Math.floor(Math.random() * (COLS - 4)) + 1;
              var y = Math.floor(Math.random() * (ROWS - 4)) + 1;
              var pcx = Math.floor(COLS / 2),
                pcy = Math.floor(ROWS / 2);
              if (pcx >= x && pcx < x + 3 && pcy >= y && pcy < y + 3) continue;
              if (
                COLS - 1 >= x &&
                COLS - 1 < x + 3 &&
                ROWS - 1 >= y &&
                ROWS - 1 < y + 3
              )
                continue;
              var ok = true;
              for (var dx = 0; dx < 3 && ok; dx++)
                for (var dy = 0; dy < 3 && ok; dy++)
                  if (cellOccupied(x + dx, y + dy)) ok = false;
              if (!ok) continue;
              var gateX = x + 1;
              var gateY = y + 2;
              var animals = [];
              for (var a = 0; a < 2; a++) {
                animals.push({
                  ox: 0.5 + Math.random(),
                  oy: 0.5 + Math.random(),
                  type: Math.random() < 0.5 ? 'sheep' : 'goat',
                });
              }
              var obj = {
                type: type,
                x: x,
                y: y,
                pw: 3,
                ph: 3,
                gateX: gateX,
                gateY: gateY,
                cleansed: false,
                flipAnim: 0,
                whipAnim: 0,
                escapeAnim: 0,
                animals: animals,
              };
              objects.push(obj);
              placed = true;
            } else {
              var x = Math.floor(Math.random() * (COLS - 2)) + 1;
              var y = Math.floor(Math.random() * (ROWS - 2)) + 1;
              if (x === Math.floor(COLS / 2) && y === Math.floor(ROWS / 2))
                continue;
              if (x === COLS - 1 && y === ROWS - 1) continue;
              if (cellOccupied(x, y)) continue;
              var obj = {
                type: type,
                x: x,
                y: y,
                cleansed: false,
                flipAnim: 0,
                whipAnim: 0,
                animalType:
                  type === 'cage'
                    ? Math.random() < 0.5
                      ? 'bird'
                      : 'dove'
                    : Math.random() < 0.5
                      ? 'sheep'
                      : 'goat',
                coins: [],
                escapeAnim: 0,
              };
              if (type === 'table') {
                for (var c = 0; c < 5; c++)
                  obj.coins.push({
                    ox: (Math.random() - 0.5) * 0.5,
                    oy: (Math.random() - 0.5) * 0.5,
                    flying: false,
                    vx: 0,
                    vy: 0,
                  });
              }
              objects.push(obj);
              placed = true;
            }
          }
        }
      }

      function placeWalls(count) {
        for (var i = 0; i < count; i++) {
          var attempts = 0,
            placed = false;
          while (!placed && attempts < 80) {
            attempts++;
            var x = Math.floor(Math.random() * (COLS - 2)) + 1;
            var y = Math.floor(Math.random() * (ROWS - 2)) + 1;
            if (x === Math.floor(COLS / 2) && y === Math.floor(ROWS / 2))
              continue;
            if (x === COLS - 1 && y === ROWS - 1) continue;
            if (cellOccupied(x, y)) continue;
            // Don't place adjacent to any existing object (keep paths open)
            var tooClose = false;
            for (var j = 0; j < objects.length; j++) {
              var o = objects[j];
              if (o.type === 'pen') {
                for (var dx = -1; dx <= o.pw; dx++)
                  for (var dy = -1; dy <= o.ph; dy++) {
                    if (x === o.x + dx && y === o.y + dy) {
                      tooClose = true;
                    }
                  }
                if (tooClose) break;
              } else {
                if (Math.abs(x - o.x) <= 1 && Math.abs(y - o.y) <= 1) {
                  tooClose = true;
                  break;
                }
              }
            }
            if (tooClose) continue;
            objects.push({
              type: 'wall',
              x: x,
              y: y,
              cleansed: false,
              flipAnim: 0,
              whipAnim: 0,
            });
            placed = true;
          }
        }
      }

      function cellOccupied(x, y) {
        if (x === player.gx && y === player.gy) return true;
        for (var i = 0; i < objects.length; i++) {
          var o = objects[i];
          if (o.cleansed) continue;
          if (o.type === 'pen') {
            if (x >= o.x && x < o.x + o.pw && y >= o.y && y < o.y + o.ph)
              return true;
          } else {
            if (o.x === x && o.y === y) return true;
          }
        }
        return false;
      }

      function getPlayerGrid() {
        // Once a step has started, treat the destination as the logical cell
        // so facing checks match what the player is walking toward.
        if (player.tween >= 0) return { x: player.tx, y: player.ty };
        return { x: player.gx, y: player.gy };
      }

      function getFacingObject() {
        var p = getPlayerGrid();
        var px = p.x + player.dir.x,
          py = p.y + player.dir.y;
        for (var j = 0; j < objects.length; j++) {
          var o = objects[j];
          if (o.cleansed || o.type === 'wall') continue;
          if (o.type === 'pen') {
            if (px === o.gateX && py === o.gateY) return o;
          } else if (o.x === px && o.y === py) {
            return o;
          }
        }
        return null;
      }

      function cleanseObject(o, kind) {
        if (!o || o.cleansed) return false;
        if (kind === 'whip') {
          if (o.type === 'pen') {
            o.cleansed = true;
            o.whipAnim = 0.5;
            o.escapeAnim = 1;
            cleansedCount++;
            var gpx = FX + o.gateX * CELL + CELL / 2,
              gpy = FY + o.gateY * CELL + CELL / 2;
            spawnParticles(gpx, gpy, '#f0d878', 12);
            popups.push({
              x: gpx,
              y: gpy - 5,
              text: 'FREED!',
              life: 1,
              color: '#5cb85c',
            });
            for (var ai = 0; ai < o.animals.length; ai++) {
              escapedAnimals.push({
                x: FX + (o.x + o.animals[ai].ox) * CELL + CELL / 2,
                y: FY + (o.y + o.animals[ai].oy) * CELL + CELL / 2,
                vx: 0,
                vy: 0,
                cd: Math.random() * 2,
                type: o.animals[ai].type,
              });
            }
            shake = 4;
            updateHUD();
            checkLevelComplete();
            return true;
          }
          if (o.type === 'cage') {
            o.cleansed = true;
            o.whipAnim = 0.5;
            o.escapeAnim = 1;
            cleansedCount++;
            spawnParticles(
              FX + o.x * CELL + CELL / 2,
              FY + o.y * CELL + CELL / 2,
              '#f0d878',
              10,
            );
            popups.push({
              x: FX + o.x * CELL + CELL / 2,
              y: FY + o.y * CELL,
              text: 'FREED!',
              life: 1,
              color: '#5cb85c',
            });
            escapedBirds.push({
              x: FX + o.x * CELL + CELL / 2,
              y: FY + o.y * CELL + CELL / 2,
              vx: (Math.random() - 0.5) * 30,
              vy: -40 - Math.random() * 20,
              life: 5,
              flap: 0,
            });
            shake = 4;
            updateHUD();
            checkLevelComplete();
            return true;
          }
          return false;
        }
        if (kind === 'flip' && o.type === 'table') {
          o.cleansed = true;
          o.flipAnim = 0.8;
          cleansedCount++;
          for (var c = 0; c < o.coins.length; c++) {
            o.coins[c].flying = true;
            o.coins[c].vx = (Math.random() - 0.5) * 200;
            o.coins[c].vy = -150 - Math.random() * 100;
          }
          spawnParticles(
            FX + o.x * CELL + CELL / 2,
            FY + o.y * CELL + CELL / 2,
            '#f0d878',
            10,
          );
          popups.push({
            x: FX + o.x * CELL + CELL / 2,
            y: FY + o.y * CELL,
            text: 'FLIPPED!',
            life: 1,
            color: '#e74c3c',
          });
          shake = 5;
          updateHUD();
          checkLevelComplete();
          return true;
        }
        return false;
      }

      function doWhip() {
        if (player.whipT > 0 || player.flipT > 0) return;
        var o = getFacingObject();
        if (!o || o.type === 'table') return;
        if (cleanseObject(o, 'whip')) {
          player.whipT = 0.4;
          whipTimer = 0.4;
        }
      }

      function doFlip() {
        if (player.flipT > 0 || player.whipT > 0) return;
        var o = getFacingObject();
        if (!o || o.type !== 'table') return;
        if (cleanseObject(o, 'flip')) {
          player.flipT = 0.4;
        }
      }

      function checkLevelComplete() {
        var interactable = 0;
        for (var i = 0; i < objects.length; i++) {
          if (objects[i].type === 'wall') continue;
          interactable++;
        }
        if (cleansedCount >= interactable) {
          state = 'levelComplete';
          bestLevel = GameHighScore.update(BEST_KEY, level);
          updateHUD();
          showOverlay(
            'Level ' + level + ' Complete!',
            'The temple is cleansed!',
            '',
            'Cleansed: 100% · Time left: ' + Math.ceil(gameTime) + 's',
            'Press SPACE for Level ' + (level + 1),
            false,
          );
        }
      }

      function gameOver() {
        state = 'gameOver';
        hideOverlay();
        bestLevel = GameHighScore.update(BEST_KEY, level);
        updateHUD();
      }

      function showOverlay(title, msg, sub, stat, prompt, bad) {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = title;
        overlaySub.textContent = sub || '';
        overlayMessage.textContent = msg;
        overlayMessage.className = 'overlay-message' + (bad ? ' bad' : '');
        overlayStat.textContent = stat || '';
        btnPrompt.textContent = prompt || 'Press SPACE to continue';
      }
      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      function updateHUD() {
        levelDisplay.textContent = level;
        var interactable = 0;
        for (var i = 0; i < objects.length; i++) {
          if (objects[i].type !== 'wall') interactable++;
        }
        var pct =
          interactable > 0
            ? Math.round((cleansedCount / interactable) * 100)
            : 0;
        cleansedDisplay.textContent = pct + '%';
        progressBarFill.style.width = pct + '%';
        timeDisplay.textContent = Math.max(0, Math.ceil(gameTime));
        if (bestDisplay) bestDisplay.textContent = bestLevel;
      }

      function spawnParticles(x, y, color, count) {
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2,
            s = 60 + Math.random() * 100;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 50,
            life: 0.6 + Math.random() * 0.4,
            color: color,
            size: 2 + Math.random() * 3,
          });
        }
      }

      function update(dt) {
        animTime += dt;
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 250 * dt;
          p.life -= dt * 2;
        }
        particles = particles.filter(function (p) {
          return p.life > 0;
        });
        for (var i = 0; i < popups.length; i++) popups[i].life -= dt * 1.5;
        popups = popups.filter(function (p) {
          return p.life > 0;
        });
        if (shake > 0) shake -= dt * 30;
        // Update escaped birds
        for (var i = 0; i < escapedBirds.length; i++) {
          var b = escapedBirds[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.vy += 15 * dt;
          b.vx *= 0.99;
          b.flap += dt * 12;
          b.life -= dt;
        }
        escapedBirds = escapedBirds.filter(function (b) {
          return b.life > 0 && b.y > FY - 60;
        });
        // Update escaped animals (wander randomly)
        for (var i = 0; i < escapedAnimals.length; i++) {
          var a = escapedAnimals[i];
          a.cd -= dt;
          if (a.cd <= 0) {
            a.vx = (Math.random() - 0.5) * 40;
            a.vy = (Math.random() - 0.5) * 40;
            a.cd = 1 + Math.random() * 2;
          }
          a.x += a.vx * dt;
          a.y += a.vy * dt;
          // Keep within grid bounds
          if (a.x < FX + 10) {
            a.x = FX + 10;
            a.vx = Math.abs(a.vx);
          }
          if (a.x > FX + FW - 10) {
            a.x = FX + FW - 10;
            a.vx = -Math.abs(a.vx);
          }
          if (a.y < FY + 10) {
            a.y = FY + 10;
            a.vy = Math.abs(a.vy);
          }
          if (a.y > FY + FH - 10) {
            a.y = FY + FH - 10;
            a.vy = -Math.abs(a.vy);
          }
        }
        for (var i = 0; i < objects.length; i++) {
          if (objects[i].flipAnim > 0) objects[i].flipAnim -= dt;
          if (objects[i].whipAnim > 0) objects[i].whipAnim -= dt;
          if (objects[i].coins)
            for (var c = 0; c < objects[i].coins.length; c++) {
              var coin = objects[i].coins[c];
              if (coin.flying) {
                coin.vy += 300 * dt;
                coin.ox += coin.vx * dt * 0.01;
                coin.oy += coin.vy * dt * 0.01;
              }
            }
        }
        if (player.whipT > 0) player.whipT -= dt;
        if (player.flipT > 0) player.flipT -= dt;
        if (whipTimer > 0) whipTimer -= dt;
        if (state !== 'playing') return;
        gameTime -= dt;
        if (gameTime <= 0) {
          gameTime = 0;
          gameOver();
          return;
        }
        // Grid-based movement
        if (player.moveCD > 0) player.moveCD -= dt;
        // Update tween
        if (player.tween >= 0) {
          player.tween += dt * 6;
          if (player.tween >= 1) {
            player.tween = -1;
            player.gx = player.tx;
            player.gy = player.ty;
            player.x = player.gx;
            player.y = player.gy;
          } else {
            player.x = player.gx + (player.tx - player.gx) * player.tween;
            player.y = player.gy + (player.ty - player.gy) * player.tween;
            player.walkAnim += dt * 10;
          }
        }
        // Accept new movement only when tween is done
        if (player.tween < 0) {
          var dx = 0,
            dy = 0;
          if (keys['arrowleft'] || keys['a']) dx = -1;
          else if (keys['arrowright'] || keys['d']) dx = 1;
          if (keys['arrowup'] || keys['w']) dy = -1;
          else if (keys['arrowdown'] || keys['s']) dy = 1;
          // Prefer horizontal if both pressed
          if (dx && dy) {
            dy = 0;
          }
          if (dx || dy) {
            if (dx > 0) player.dir = { x: 1, y: 0 };
            else if (dx < 0) player.dir = { x: -1, y: 0 };
            else if (dy > 0) player.dir = { x: 0, y: 1 };
            else if (dy < 0) player.dir = { x: 0, y: -1 };
            var nx = player.gx + player.dir.x,
              ny = player.gy + player.dir.y;
            // Bounds check
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
              player.walkAnim = 0;
            } else {
              // Check blocked
              var blocked = false;
              for (var wi = 0; wi < objects.length; wi++) {
                var wo = objects[wi];
                if (wo.cleansed) continue;
                if (wo.type === 'pen') {
                  if (
                    nx >= wo.x &&
                    nx < wo.x + wo.pw &&
                    ny >= wo.y &&
                    ny < wo.y + wo.ph
                  ) {
                    blocked = true;
                    break;
                  }
                } else {
                  if (wo.x === nx && wo.y === ny) {
                    blocked = true;
                    break;
                  }
                }
              }
              if (!blocked) {
                player.tx = nx;
                player.ty = ny;
                player.tween = 0;
                player.walkAnim += dt * 10;
              } else {
                player.walkAnim = 0;
              }
            }
          } else {
            player.walkAnim = 0;
          }
        }
        updateHUD();
      }

      function shadeColor(color, pct) {
        var R = parseInt(color.substr(1, 2), 16),
          G = parseInt(color.substr(3, 2), 16),
          B = parseInt(color.substr(5, 2), 16);
        R = Math.min(
          255,
          Math.max(0, Math.round(R + (pct < 0 ? R : 255 - R) * pct)),
        );
        G = Math.min(
          255,
          Math.max(0, Math.round(G + (pct < 0 ? G : 255 - G) * pct)),
        );
        B = Math.min(
          255,
          Math.max(0, Math.round(B + (pct < 0 ? B : 255 - B) * pct)),
        );
        return (
          '#' +
          (R < 16 ? '0' : '') +
          R.toString(16) +
          (G < 16 ? '0' : '') +
          G.toString(16) +
          (B < 16 ? '0' : '') +
          B.toString(16)
        );
      }

      function render() {
        if (state === 'menu') {
          renderMenu();
          return;
        }
        if (state === 'gameOver') {
          renderGameOver();
          return;
        }
        var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
        var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
        ctx.save();
        ctx.translate(sx, sy);
        drawTempleBg();
        drawTempleFloor();
        drawInteractionHint();
        for (var i = 0; i < objects.length; i++) drawObject(objects[i]);
        drawEscapedAnimals();
        drawPlayer();
        drawEscapedBirds();
        drawParticles();
        drawPopups();
        if (player.whipT > 0) drawWhipEffect();
        ctx.restore();
        if (state === 'paused') drawPauseOverlay();
      }

      function drawTempleBg() {
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1a1520');
        grad.addColorStop(0.5, '#2a2530');
        grad.addColorStop(1, '#3a3028');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      function drawTempleFloor() {
        // Back wall area (top strip)
        var wallGrad = ctx.createLinearGradient(0, 0, 0, FY + 20);
        wallGrad.addColorStop(0, '#3a2820');
        wallGrad.addColorStop(1, '#5a4838');
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, W, FY + 20);
        // Curtain/veil hint at top
        var veilGrad = ctx.createLinearGradient(0, 0, 0, FY + 10);
        veilGrad.addColorStop(0, 'rgba(90,30,30,0.5)');
        veilGrad.addColorStop(1, 'rgba(90,30,30,0)');
        ctx.fillStyle = veilGrad;
        ctx.fillRect(0, 0, W, FY + 10);
        // Checkerboard stone floor
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#8a7860' : '#7a6850';
            ctx.fillRect(FX + c * CELL, FY + r * CELL, CELL, CELL);
          }
        }
        // Tile grout
        ctx.strokeStyle = 'rgba(50,40,30,0.35)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(FX + i * CELL, FY);
          ctx.lineTo(FX + i * CELL, FY + FH);
          ctx.stroke();
        }
        for (var i = 0; i <= ROWS; i++) {
          ctx.beginPath();
          ctx.moveTo(FX, FY + i * CELL);
          ctx.lineTo(FX + FW, FY + i * CELL);
          ctx.stroke();
        }
        // Stone texture specks
        ctx.fillStyle = 'rgba(100,85,65,0.15)';
        for (var i = 0; i < 100; i++) {
          var tx = FX + ((i * 37) % FW),
            ty = FY + ((i * 53) % FH);
          ctx.fillRect(tx, ty, 2, 2);
        }
        // Decorative border
        ctx.strokeStyle = '#4a3828';
        ctx.lineWidth = 4;
        ctx.strokeRect(FX - 2, FY - 2, FW + 4, FH + 4);
        // Wall torches at top edge
        drawTorch(FX + CELL * 2, FY + 6);
        drawTorch(FX + CELL * 8, FY + 6);
        drawTorch(FX + CELL * 14, FY + 6);
        // Decorative altar in bottom-right corner area (non-blocking visual)
        drawAltar(FX + CELL * (COLS - 1), FY + CELL * (ROWS - 1));
        // Vignette
        var vig = ctx.createRadialGradient(
          W / 2,
          H / 2,
          W * 0.3,
          W / 2,
          H / 2,
          W * 0.72,
        );
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(40,30,20,0.25)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }
      function drawTorch(tx, ty) {
        // Bracket
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(tx - 4, ty, 8, 10);
        // Handle
        ctx.fillStyle = '#5a3818';
        ctx.fillRect(tx - 2, ty + 2, 4, 8);
        // Flickering flame
        var flicker = Math.sin(animTime * 8 + tx) * 2;
        ctx.fillStyle = '#e08020';
        ctx.beginPath();
        ctx.arc(tx, ty - 2 + flicker, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0c030';
        ctx.beginPath();
        ctx.arc(tx, ty - 4 + flicker, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff0a0';
        ctx.beginPath();
        ctx.arc(tx, ty - 5 + flicker, 2, 0, Math.PI * 2);
        ctx.fill();
        // Glow
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#f0a030';
        ctx.beginPath();
        ctx.arc(tx, ty - 2, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      function drawAltar(ax, ay) {
        // Stone block
        ctx.fillStyle = '#6a5848';
        ctx.fillRect(ax + 4, ay + 8, CELL - 8, CELL * 0.6);
        ctx.fillStyle = '#7a6850';
        ctx.fillRect(ax + 4, ay + 8, CELL - 8, 4);
        ctx.strokeStyle = '#4a3828';
        ctx.lineWidth = 1;
        ctx.strokeRect(ax + 4, ay + 8, CELL - 8, CELL * 0.6);
        // Decorative cloth on top
        ctx.fillStyle = '#8a3020';
        ctx.fillRect(ax + 8, ay + 4, CELL - 16, 8);
        ctx.fillStyle = '#a04030';
        ctx.fillRect(ax + 8, ay + 4, CELL - 16, 3);
        // Gold trim
        ctx.fillStyle = '#f0d878';
        ctx.fillRect(ax + 8, ay + 11, CELL - 16, 2);
      }

      function drawInteractionHint() {
        if (state !== 'playing') return;
        var o = getFacingObject();
        if (!o) return;
        var p = getPlayerGrid();
        var tx = p.x + player.dir.x,
          ty = p.y + player.dir.y;
        var hx = FX + tx * CELL,
          hy = FY + ty * CELL;
        if (o.type === 'pen') {
          hx = FX + o.gateX * CELL;
          hy = FY + o.gateY * CELL;
        }
        ctx.strokeStyle = 'rgba(240,216,120,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(hx + 2, hy + 2, CELL - 4, CELL - 4);
        ctx.strokeStyle = 'rgba(240,216,120,0.3)';
        ctx.strokeRect(hx - 2, hy - 2, CELL + 4, CELL + 4);
        var label = o.type === 'table' ? 'FLIP (K)' : 'WHIP (J)';
        ctx.font = 'bold 11px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(20,15,30,0.75)';
        ctx.fillRect(hx + CELL / 2 - 34, hy - 16, 68, 14);
        ctx.fillStyle = '#f0d878';
        ctx.fillText(label, hx + CELL / 2, hy - 5);
      }

      function drawObject(o) {
        var x = FX + o.x * CELL,
          y = FY + o.y * CELL;
        if (o.type === 'table') drawTable(x, y, o);
        else if (o.type === 'cage') drawCage(x, y, o);
        else if (o.type === 'pen') drawPen(x, y, o);
        else if (o.type === 'wall') drawWall(x, y, o);
      }

      function drawWall(x, y, o) {
        // Stone wall block
        ctx.fillStyle = '#5a4838';
        ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
        ctx.fillStyle = '#6a5848';
        ctx.fillRect(x + 4, y + 4, CELL - 8, CELL - 8);
        // Stone texture
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(x + 8, y + 8, 4, 4);
        ctx.fillRect(x + CELL - 16, y + CELL - 16, 4, 4);
        ctx.fillRect(x + 10, y + CELL - 18, 3, 3);
        // Mortar lines
        ctx.strokeStyle = '#3a2818';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 4, y + CELL / 2);
        ctx.lineTo(x + CELL - 4, y + CELL / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + CELL / 2, y + 4);
        ctx.lineTo(x + CELL / 2, y + CELL / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + CELL / 2, y + CELL / 2);
        ctx.lineTo(x + CELL / 2, y + CELL - 4);
        ctx.stroke();
        // Border
        ctx.strokeStyle = '#3a2818';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x + 3, y + 3, CELL - 6, CELL - 6);
        // Highlight
        ctx.fillStyle = 'rgba(120,100,80,0.3)';
        ctx.fillRect(x + 4, y + 4, CELL - 8, 3);
      }

      function drawTable(x, y, o) {
        if (o.cleansed) {
          // Flipped table on its side
          var flipProgress = o.flipAnim > 0 ? 1 - o.flipAnim / 0.8 : 1;
          var angle = (flipProgress * Math.PI) / 2;
          ctx.save();
          ctx.translate(x + CELL / 2, y + CELL / 2);
          ctx.rotate(angle);
          // Table legs up
          ctx.fillStyle = '#5a3818';
          ctx.fillRect(-2, -CELL * 0.3, 4, CELL * 0.25);
          ctx.fillRect(CELL * 0.25 - 2, -CELL * 0.3, 4, CELL * 0.25);
          ctx.fillRect(-2, CELL * 0.05, 4, CELL * 0.25);
          ctx.fillRect(CELL * 0.25 - 2, CELL * 0.05, 4, CELL * 0.25);
          // Tabletop (now vertical)
          ctx.fillStyle = '#8b5e3c';
          ctx.fillRect(-CELL * 0.35, -CELL * 0.35, CELL * 0.7, CELL * 0.7);
          ctx.fillStyle = '#a07050';
          ctx.fillRect(-CELL * 0.35, -CELL * 0.35, CELL * 0.7, 3);
          ctx.strokeStyle = '#4a2810';
          ctx.lineWidth = 1;
          ctx.strokeRect(-CELL * 0.35, -CELL * 0.35, CELL * 0.7, CELL * 0.7);
          ctx.restore();
          // Flying coins
          for (var c = 0; c < o.coins.length; c++) {
            if (o.coins[c].flying) {
              var cx = x + CELL / 2 + o.coins[c].ox * CELL,
                cy = y + CELL / 2 + o.coins[c].oy * CELL;
              drawCoin(cx, cy);
            }
          }
          return;
        }
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(
          x + CELL / 2,
          y + CELL * 0.85,
          CELL * 0.3,
          CELL * 0.08,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fill();
        // Table legs
        ctx.fillStyle = '#5a3818';
        ctx.fillRect(x + CELL * 0.2, y + CELL * 0.55, 4, CELL * 0.3);
        ctx.fillRect(x + CELL * 0.7, y + CELL * 0.55, 4, CELL * 0.3);
        // Tabletop
        ctx.fillStyle = '#8b5e3c';
        ctx.fillRect(x + CELL * 0.1, y + CELL * 0.3, CELL * 0.8, CELL * 0.3);
        ctx.fillStyle = '#a07050';
        ctx.fillRect(x + CELL * 0.1, y + CELL * 0.3, CELL * 0.8, 3);
        ctx.fillStyle = '#6b4423';
        ctx.fillRect(x + CELL * 0.1, y + CELL * 0.55 - 3, CELL * 0.8, 3);
        ctx.strokeStyle = '#4a2810';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + CELL * 0.1, y + CELL * 0.3, CELL * 0.8, CELL * 0.3);
        // Coins on table
        for (var c = 0; c < o.coins.length; c++) {
          if (!o.coins[c].flying)
            drawCoin(
              x + CELL / 2 + o.coins[c].ox * CELL,
              y + CELL * 0.38 + o.coins[c].oy * CELL,
            );
        }
      }

      function drawCoin(x, y) {
        var g = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, 5);
        g.addColorStop(0, '#fff8d0');
        g.addColorStop(0.5, '#f0d878');
        g.addColorStop(1, '#c4a030');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#a88820';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }

      function drawCage(x, y, o) {
        if (o.cleansed) {
          // Broken cage (opened)
          ctx.strokeStyle = 'rgba(90,56,24,0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + CELL * 0.2, y + CELL * 0.3);
          ctx.lineTo(x + CELL * 0.2, y + CELL * 0.8);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + CELL * 0.8, y + CELL * 0.3);
          ctx.lineTo(x + CELL * 0.8, y + CELL * 0.8);
          ctx.stroke();
          // Top bar bent
          ctx.beginPath();
          ctx.moveTo(x + CELL * 0.2, y + CELL * 0.3);
          ctx.quadraticCurveTo(
            x + CELL / 2,
            y + CELL * 0.15,
            x + CELL * 0.8,
            y + CELL * 0.3,
          );
          ctx.stroke();
          return;
        }
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(
          x + CELL / 2,
          y + CELL * 0.85,
          CELL * 0.3,
          CELL * 0.08,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fill();
        // Cage base
        ctx.fillStyle = '#5a3818';
        ctx.fillRect(x + CELL * 0.2, y + CELL * 0.75, CELL * 0.6, CELL * 0.12);
        // Cage bars (wooden)
        ctx.strokeStyle = '#8b5e3c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + CELL * 0.2, y + CELL * 0.75);
        ctx.lineTo(x + CELL * 0.2, y + CELL * 0.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + CELL * 0.4, y + CELL * 0.75);
        ctx.lineTo(x + CELL * 0.4, y + CELL * 0.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + CELL * 0.6, y + CELL * 0.75);
        ctx.lineTo(x + CELL * 0.6, y + CELL * 0.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + CELL * 0.8, y + CELL * 0.75);
        ctx.lineTo(x + CELL * 0.8, y + CELL * 0.3);
        ctx.stroke();
        // Cage top
        ctx.beginPath();
        ctx.moveTo(x + CELL * 0.2, y + CELL * 0.3);
        ctx.quadraticCurveTo(
          x + CELL / 2,
          y + CELL * 0.15,
          x + CELL * 0.8,
          y + CELL * 0.3,
        );
        ctx.stroke();
        // Bird inside
        drawBird(x + CELL / 2, y + CELL * 0.52, false);
      }

      function drawBird(cx, cy, flown) {
        if (flown) {
          ctx.fillStyle = '#d4a060';
          // Spread wings
          ctx.beginPath();
          ctx.moveTo(cx - 6, cy);
          ctx.lineTo(cx - 10, cy - 4);
          ctx.lineTo(cx - 2, cy + 2);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cx + 6, cy);
          ctx.lineTo(cx + 10, cy - 4);
          ctx.lineTo(cx + 2, cy + 2);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(cx - 2, cy - 2, 4, 4);
        } else {
          ctx.fillStyle = '#c49050';
          ctx.fillRect(cx - 2, cy - 2, 4, 4);
          ctx.fillStyle = '#a07030';
          ctx.fillRect(cx - 2, cy, 4, 1);
          // Tiny head
          ctx.fillStyle = '#d4a060';
          ctx.beginPath();
          ctx.arc(cx, cy - 4, 2, 0, Math.PI * 2);
          ctx.fill();
          // Wing detail
          ctx.fillStyle = '#a07030';
          ctx.fillRect(cx - 3, cy - 1, 2, 2);
        }
      }

      function drawPen(x, y, o) {
        var pw = o.pw * CELL,
          ph = o.ph * CELL;
        if (o.cleansed) {
          // Broken fence scattered
          ctx.strokeStyle = 'rgba(90,56,24,0.35)';
          ctx.lineWidth = 2;
          for (var s = 0; s < 8; s++) {
            var sx = x + 4 + ((s * 37) % (pw - 8)),
              sy = y + 4 + ((s * 53) % (ph - 8));
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + 12, sy + 4);
            ctx.stroke();
          }
          return;
        }
        // Dirt/hay ground inside pen
        ctx.fillStyle = '#a08858';
        ctx.fillRect(x + 4, y + 4, pw - 8, ph - 8);
        // Hay texture
        ctx.fillStyle = 'rgba(180,160,100,0.3)';
        for (var i = 0; i < 24; i++) {
          ctx.fillRect(
            x + 8 + ((i * 13) % (pw - 16)),
            y + 8 + ((i * 17) % (ph - 16)),
            3,
            1,
          );
        }
        // Fence post helper
        function post(px, py) {
          ctx.fillStyle = '#5a3818';
          ctx.fillRect(px - 3, py - 3, 6, 6);
          ctx.fillStyle = '#7a5028';
          ctx.fillRect(px - 2, py - 2, 4, 4);
        }
        // Corner + mid-edge posts
        post(x + 4, y + 4);
        post(x + pw - 4, y + 4);
        post(x + 4, y + ph - 4);
        post(x + pw - 4, y + ph - 4);
        post(x + pw / 2, y + 4);
        post(x + pw / 2, y + ph - 4);
        post(x + 4, y + ph / 2);
        post(x + pw - 4, y + ph / 2);
        // Gate position in pixels - relative to pen's x,y
        var gateRelX = (o.gateX - o.x) * CELL;
        // Fence rails - top, left, right
        ctx.strokeStyle = '#8b5e3c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 4);
        ctx.lineTo(x + pw - 4, y + 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 4);
        ctx.lineTo(x + 4, y + ph - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + pw - 4, y + 4);
        ctx.lineTo(x + pw - 4, y + ph - 4);
        ctx.stroke();
        // Bottom rail split at gate
        ctx.beginPath();
        ctx.moveTo(x + 4, y + ph - 4);
        ctx.lineTo(x + gateRelX, y + ph - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + gateRelX + CELL, y + ph - 4);
        ctx.lineTo(x + pw - 4, y + ph - 4);
        ctx.stroke();
        // Lower rail
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 4, y + ph - 12);
        ctx.lineTo(x + gateRelX, y + ph - 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + gateRelX + CELL, y + ph - 12);
        ctx.lineTo(x + pw - 4, y + ph - 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 12);
        ctx.lineTo(x + pw - 4, y + 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 12, y + 4);
        ctx.lineTo(x + 12, y + ph - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + pw - 12, y + 4);
        ctx.lineTo(x + pw - 12, y + ph - 4);
        ctx.stroke();
        // Red gate
        ctx.strokeStyle = '#c44030';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + gateRelX + 3, y + ph - 12, CELL - 6, 8);
        ctx.strokeStyle = '#a03020';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + gateRelX + CELL / 2, y + ph - 12);
        ctx.lineTo(x + gateRelX + CELL / 2, y + ph - 4);
        ctx.stroke();
        // Animals inside
        for (var a = 0; a < o.animals.length; a++) {
          drawAnimal(
            x + o.animals[a].ox * CELL,
            y + o.animals[a].oy * CELL,
            o.animals[a].type,
            false,
          );
        }
      }

      function drawAnimal(cx, cy, type, escaped) {
        var bodyColor = type === 'sheep' ? '#e8e0d0' : '#8a6840';
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // Head
        ctx.fillStyle = type === 'sheep' ? '#d4a574' : '#6a4830';
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        // Legs
        ctx.fillStyle = '#3a2818';
        ctx.fillRect(cx - 4, cy + 4, 2, 3);
        ctx.fillRect(cx + 2, cy + 4, 2, 3);
        if (escaped) {
          // Walking animation - leg movement
          var lp = Math.sin(animTime * 8);
          ctx.fillRect(cx - 4, cy + 4 + lp, 2, 3);
          ctx.fillRect(cx + 2, cy + 4 - lp, 2, 3);
        }
        // Eye
        ctx.fillStyle = '#222';
        ctx.fillRect(cx + 5, cy - 3, 1, 1);
      }

      function drawPlayer() {
        var x = FX + player.x * CELL + CELL / 2,
          y = FY + player.y * CELL + CELL / 2;
        var bob = Math.sin(player.walkAnim) * 2;
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(
          x,
          y + CELL * 0.32,
          CELL * 0.25,
          CELL * 0.08,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fill();
        // Robe (white tunic)
        ctx.fillStyle = '#e8e0d0';
        ctx.beginPath();
        ctx.moveTo(x - CELL * 0.2, y + CELL * 0.28);
        ctx.quadraticCurveTo(
          x,
          y + CELL * 0.35,
          x + CELL * 0.2,
          y + CELL * 0.28,
        );
        ctx.lineTo(x + CELL * 0.15, y - CELL * 0.08);
        ctx.lineTo(x - CELL * 0.15, y - CELL * 0.08);
        ctx.closePath();
        ctx.fill();
        // Girdle (loins girded - rope belt)
        ctx.fillStyle = '#8b6a3a';
        ctx.fillRect(x - CELL * 0.17, y + CELL * 0.02, CELL * 0.34, 4);
        ctx.strokeStyle = '#6a5028';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - CELL * 0.17, y + CELL * 0.02, CELL * 0.34, 4);
        // Chest (bare upper)
        ctx.fillStyle = '#d4a574';
        ctx.fillRect(x - CELL * 0.1, y - CELL * 0.08, CELL * 0.2, CELL * 0.12);
        // Arms
        ctx.fillStyle = '#d4a574';
        ctx.fillRect(x - CELL * 0.18, y - CELL * 0.05, 4, CELL * 0.12);
        ctx.fillRect(x + CELL * 0.14, y - CELL * 0.05, 4, CELL * 0.12);
        // Head
        ctx.fillStyle = '#d4a574';
        ctx.beginPath();
        ctx.arc(x, y - CELL * 0.18, CELL * 0.12, 0, Math.PI * 2);
        ctx.fill();
        // Hair (dark, short)
        ctx.fillStyle = '#3a2818';
        ctx.beginPath();
        ctx.arc(x, y - CELL * 0.22, CELL * 0.12, Math.PI, 0);
        ctx.fill();
        // Beard
        ctx.fillStyle = '#3a2818';
        ctx.fillRect(x - 3, y - CELL * 0.14, 6, 5);
        // Eyes
        ctx.fillStyle = '#333';
        var ex = player.dir.x * 1.5,
          ey = player.dir.y * 1;
        ctx.fillRect(x - 3 + ex, y - CELL * 0.2 + ey, 2, 2);
        ctx.fillRect(x + 1 + ex, y - CELL * 0.2 + ey, 2, 2);
        // Whip (in hand, directional)
        var wx = x + player.dir.x * CELL * 0.25,
          wy = y + player.dir.y * CELL * 0.25 + bob;
        ctx.strokeStyle = '#8b5e3c';
        ctx.lineWidth = 2;
        if (player.whipT > 0) {
          // Whipping animation - whip extends
          var wp = 1 - player.whipT / 0.4;
          var wlen = CELL * 0.5 * Math.sin(wp * Math.PI);
          ctx.beginPath();
          ctx.moveTo(wx, wy);
          ctx.lineTo(
            wx + player.dir.x * wlen,
            wy + player.dir.y * wlen + Math.sin(animTime * 20) * 3,
          );
          ctx.stroke();
          // Whip tip
          ctx.fillStyle = '#5a3818';
          ctx.fillRect(
            wx + player.dir.x * wlen - 2,
            wy + player.dir.y * wlen - 2,
            4,
            4,
          );
        } else {
          // Whip at rest (coiled)
          ctx.beginPath();
          ctx.moveTo(wx, wy);
          ctx.lineTo(wx + player.dir.x * 8, wy + player.dir.y * 8);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(
            wx + player.dir.x * 8,
            wy + player.dir.y * 8,
            3,
            0,
            Math.PI * 2,
          );
          ctx.strokeStyle = '#8b5e3c';
          ctx.stroke();
        }
      }

      function drawWhipEffect() {
        var px = FX + player.x * CELL + CELL / 2 + player.dir.x * CELL,
          py = FY + player.y * CELL + CELL / 2 + player.dir.y * CELL;
        ctx.globalAlpha = (player.whipT / 0.4) * 0.3;
        ctx.fillStyle = '#f0d878';
        ctx.beginPath();
        ctx.arc(px, py, CELL * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawEscapedAnimals() {
        for (var i = 0; i < escapedAnimals.length; i++) {
          var a = escapedAnimals[i];
          var bob = Math.sin(animTime * 4 + i * 2) * 1;
          drawAnimal(a.x, a.y + bob, a.type, true);
        }
      }

      function drawEscapedBirds() {
        for (var i = 0; i < escapedBirds.length; i++) {
          var b = escapedBirds[i];
          ctx.globalAlpha = Math.min(1, b.life);
          var wingY = Math.sin(b.flap) * 4;
          ctx.fillStyle = '#d4a060';
          ctx.beginPath();
          ctx.moveTo(b.x - 6, b.y);
          ctx.lineTo(b.x - 10, b.y - 4 + wingY);
          ctx.lineTo(b.x - 2, b.y + 2);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(b.x + 6, b.y);
          ctx.lineTo(b.x + 10, b.y - 4 + wingY);
          ctx.lineTo(b.x + 2, b.y + 2);
          ctx.closePath();
          ctx.fill();
          ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
          ctx.fillStyle = '#a07030';
          ctx.beginPath();
          ctx.arc(b.x, b.y - 4, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawPopups() {
        for (var i = 0; i < popups.length; i++) {
          var p = popups[i];
          ctx.globalAlpha = Math.min(1, p.life);
          ctx.fillStyle = p.color || '#f0d878';
          ctx.font = 'bold 12px Georgia';
          ctx.textAlign = 'center';
          ctx.fillText(p.text, p.x, p.y - (1 - p.life) * 20);
        }
        ctx.globalAlpha = 1;
      }

      function drawPauseOverlay() {
        ctx.fillStyle = 'rgba(20,15,30,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 36px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W / 2, H / 2);
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      function renderMenu() {
        // Full-window pixel art background
        drawYeshuaFull();
        // Gradient overlays for text readability
        var topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.42);
        topGrad.addColorStop(0, 'rgba(0,0,0,0.75)');
        topGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, W, H * 0.42);
        var bottomGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
        bottomGrad.addColorStop(0, 'rgba(0,0,0,0)');
        bottomGrad.addColorStop(1, 'rgba(0,0,0,0.75)');
        ctx.fillStyle = bottomGrad;
        ctx.fillRect(0, H * 0.55, W, H * 0.45);
        // === Text ===
        ctx.textAlign = 'center';
        var titleY = H * 0.12;
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 44px Georgia';
        ctx.fillText('TEMPLE', W / 2, titleY);
        ctx.fillText('THROWDOWN', W / 2, titleY + 44);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(245,230,200,0.85)';
        ctx.font = 'italic 13px Georgia';
        ctx.fillText(
          'Cleanse the temple \· Flip tables \· Free the animals',
          W / 2,
          titleY + 72,
        );
        // Controls box
        var cy = H * 0.42;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        roundRect(W / 2 - 170, cy, 340, 90, 8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(240,216,120,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = 'rgba(240,216,120,0.9)';
        ctx.font = 'bold 12px Georgia';
        ctx.fillText('CONTROLS', W / 2, cy + 16);
        ctx.fillStyle = 'rgba(245,230,200,0.85)';
        ctx.font = '12px Georgia';
        ctx.fillText('WASD / Arrows \— Move', W / 2, cy + 36);
        ctx.fillText('J / Enter \— Whip (free animals)', W / 2, cy + 54);
        ctx.fillText('K / Shift \— Flip (flip tables)', W / 2, cy + 72);
        // Instruction line above prompt
        ctx.fillStyle = 'rgba(245,230,200,0.75)';
        ctx.font = 'italic 14px Georgia';
        ctx.fillText(
          'Cleanse the temple before time runs out!',
          W / 2,
          H * 0.83,
        );
        // Space prompt
        if (Math.sin(animTime * 3) > -0.3) {
          ctx.fillStyle = '#f0d878';
          ctx.shadowColor = 'rgba(240,216,120,0.5)';
          ctx.shadowBlur = 15;
          ctx.font = 'bold 20px Georgia';
          ctx.fillText('PRESS SPACE TO BEGIN', W / 2, H * 0.92);
          ctx.shadowBlur = 0;
        }
      }
      var yeshuaOffscreen = null;
      function drawYeshuaFull() {
        if (!yeshuaOffscreen) {
          yeshuaOffscreen = document.createElement('canvas');
          yeshuaOffscreen.width = YESHUA_MAP[0].length;
          yeshuaOffscreen.height = YESHUA_MAP.length;
          var octx = yeshuaOffscreen.getContext('2d');
          for (var r = 0; r < YESHUA_MAP.length; r++) {
            for (var c = 0; c < YESHUA_MAP[0].length; c++) {
              var ch = YESHUA_MAP[r][c];
              var color = YESHUA_PAL[ch];
              if (color) {
                octx.fillStyle = color;
                octx.fillRect(c, r, 1, 1);
              }
            }
          }
        }
        ctx.drawImage(
          yeshuaOffscreen,
          0,
          0,
          yeshuaOffscreen.width,
          yeshuaOffscreen.height,
          0,
          0,
          W,
          H,
        );
      }

      function drawYeshuaImage(cx, cy, ps) {
        var rows = YESHUA_MAP.length,
          cols = YESHUA_MAP[0].length;
        var ox = cx - (cols * ps) / 2,
          oy = cy - (rows * ps) / 2;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var ch = YESHUA_MAP[r][c];
            var color = YESHUA_PAL[ch];
            if (color) {
              ctx.fillStyle = color;
              ctx.fillRect(
                Math.round(ox + c * ps),
                Math.round(oy + r * ps),
                ps,
                ps,
              );
            }
          }
        }
      }

      function renderGameOver() {
        loadGameOverImg();
        // Full-screen art image
        if (
          gameOverImg &&
          gameOverImg.complete &&
          gameOverImg.naturalWidth > 0
        ) {
          ctx.drawImage(gameOverImg, 0, 0, W, H);
        } else {
          var grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, '#1a1018');
          grad.addColorStop(0.5, '#2a1820');
          grad.addColorStop(1, '#3a2828');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
        }
        // Top gradient for title readability
        var topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.35);
        topGrad.addColorStop(0, 'rgba(0,0,0,0.8)');
        topGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, W, H * 0.35);
        // Bottom gradient for prompt readability
        var botGrad = ctx.createLinearGradient(0, H * 0.82, 0, H);
        botGrad.addColorStop(0, 'rgba(0,0,0,0)');
        botGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, H * 0.82, W, H * 0.18);
        // === Title text at top ===
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f0d878';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 8;
        ctx.font = 'bold 30px Georgia';
        ctx.fillText('A den of robbers?', W / 2, H * 0.1);
        ctx.fillText('Not in my house!', W / 2, H * 0.1 + 38);
        ctx.shadowBlur = 0;
        // Stats below title
        ctx.fillStyle = 'rgba(245,230,200,0.85)';
        ctx.font = '14px Georgia';
        ctx.fillText('You reached Level ' + level, W / 2, H * 0.1 + 72);
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 13px Georgia';
        ctx.fillText('Best Level: ' + bestLevel, W / 2, H * 0.1 + 92);
        ctx.fillStyle = '#f0d878';
        ctx.font = 'bold 14px Georgia';
        ctx.fillText(
          'Cleansed: ' +
            cleansedCount +
            '/' +
            totalObjects +
            ' \· Time remaining: ' +
            Math.ceil(gameTime) +
            's',
          W / 2,
          H * 0.1 + 114,
        );
        // === Play again at very bottom ===
        if (Math.sin(animTime * 3) > -0.3) {
          ctx.fillStyle = '#f0d878';
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 8;
          ctx.font = 'bold 20px Georgia';
          ctx.fillText('PRESS SPACE TO TRY AGAIN', W / 2, H * 0.95);
          ctx.shadowBlur = 0;
        }
      }

      function drawTiedPharisee(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.translate(-cx, -cy);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 12, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Body (sitting, slumped)
        ctx.fillStyle = '#4a3828';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        // Robe (dark, fine linen)
        ctx.fillStyle = '#3a2838';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 14, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Arms tied behind back (rope)
        ctx.strokeStyle = '#8b6a3a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 10, cy - 4);
        ctx.lineTo(cx - 14, cy);
        ctx.lineTo(cx - 12, cy + 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 10, cy - 4);
        ctx.lineTo(cx + 14, cy);
        ctx.lineTo(cx + 12, cy + 8);
        ctx.stroke();
        // Rope binding
        ctx.strokeStyle = '#6a5028';
        ctx.lineWidth = 2;
        for (var i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.ellipse(cx, cy - 2 + i * 4, 14, 3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        // Head
        ctx.fillStyle = '#c4a074';
        ctx.beginPath();
        ctx.arc(cx, cy - 14, 10, 0, Math.PI * 2);
        ctx.fill();
        // Phylactery (small black box on forehead)
        ctx.fillStyle = '#1a1010';
        ctx.fillRect(cx - 3, cy - 20, 6, 4);
        // Tassels (tzitzit) on robe corners
        ctx.strokeStyle = '#8b7860';
        ctx.lineWidth = 1;
        for (var i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(cx - 10 + i * 7, cy + 10);
          ctx.lineTo(cx - 10 + i * 7, cy + 16);
          ctx.stroke();
        }
        // Eyes (angry/sad)
        ctx.fillStyle = '#222';
        ctx.fillRect(cx - 4, cy - 15, 2, 2);
        ctx.fillRect(cx + 2, cy - 15, 2, 2);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy - 15);
        ctx.lineTo(cx - 4, cy - 17);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 6, cy - 15);
        ctx.lineTo(cx + 2, cy - 17);
        ctx.stroke();
        // Beard (long)
        ctx.fillStyle = '#3a2818';
        ctx.fillRect(cx - 3, cy - 10, 6, 8);
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy - 4);
        ctx.lineTo(cx - 5, cy + 2);
        ctx.lineTo(cx - 2, cy);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 3, cy - 4);
        ctx.lineTo(cx + 5, cy + 2);
        ctx.lineTo(cx + 2, cy);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function loop(ts) {
        if (!lastTime) lastTime = ts;
        var dt = Math.min((ts - lastTime) / 1000, 0.05);
        lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      state = 'menu';
      loadGameOverImg();
      updateHUD();
      requestAnimationFrame(loop);
      var music = GameMusic.create({
        basePath: '../audio/temple-throwdown',
        fallbackBasePath: '.',
        toggleSelector: '#music-toggle',
      });
      music.start();
    </script>
  </body>
</html>
